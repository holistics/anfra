components:
  schemas:
    AQLDiagnostic:
      additionalProperties: false
      properties:
        column:
          format: int64
          type: integer
        line:
          format: int64
          type: integer
        message:
          type: string
        severity:
          type: string
      required:
        - message
        - severity
      type: object
    CompileError:
      additionalProperties: false
      properties:
        col:
          format: int64
          type: integer
        filePath:
          type: string
        message:
          type: string
        row:
          format: int64
          type: integer
      required:
        - message
      type: object
    CompiledQuery:
      additionalProperties: false
      properties:
        aql:
          description: "the AQL compiled: the query with its Query Input applied; absent for a SQL query"
          type: string
        columns:
          description: what each column of an explore query's answer will be; absent for other queries
          items:
            $ref: "#/components/schemas/ExploreColumn"
          type: array
        sql:
          type: string
      required:
        - sql
      type: object
    ContextEntry:
      additionalProperties: false
      properties:
        params:
          additionalProperties: {}
          type: object
        step:
          type: string
        text:
          type: string
      required:
        - step
        - text
      type: object
    ErrorBodyExportsUnavailable:
      additionalProperties: false
      description: This server cannot make exports.
      properties:
        code:
          const: exports_unavailable
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 501
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyInternalServerError:
      additionalProperties: false
      description: Something went wrong on our side.
      properties:
        code:
          const: internal_server_error
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 500
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyInvalidRequest:
      additionalProperties: false
      description: The request is not valid.
      properties:
        code:
          const: invalid_request
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/Violations"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: client
          type: string
        status:
          const: 400
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyQueryFailed:
      additionalProperties: false
      description: The query failed to run on its data source.
      properties:
        code:
          const: query_failed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 502
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyQueryInvalid:
      additionalProperties: false
      description: The query is invalid.
      properties:
        code:
          const: query_invalid
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/QueryValidation"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodySidecarUnavailable:
      additionalProperties: false
      description: A sidecar is unavailable.
      properties:
        code:
          const: sidecar_unavailable
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 503
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyValidationFailed:
      additionalProperties: false
      description: Some of the input is not valid.
      properties:
        code:
          const: validation_failed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/Violations"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ExploreColumn:
      additionalProperties: false
      properties:
        adhoc:
          description: a query-local expression, not a field the dataset defines
          type: boolean
        aggregation:
          description: an aggregated field's aggregation, such as sum or count distinct
          type: string
        fieldName:
          description: the field it draws; for an adhoc column, its name
          type: string
        isMeasure:
          type: boolean
        label:
          type: string
        modelId:
          description: the model of fieldName, as the dataset names it; absent for a dataset metric or an adhoc column
          type: string
        name:
          description: the column's key, as in fields
          type: string
      required:
        - name
        - fieldName
        - label
        - adhoc
        - isMeasure
      type: object
    ExportFormatOptions:
      additionalProperties: false
      properties:
        bom:
          description: "csv: start the file with a UTF-8 byte-order mark, which Excel needs to read non-ASCII text; set it for a file a person will open"
          type: boolean
        header:
          description: "csv: the header row: the columns' labels (the default; what readers see), their names (their keys in a query's answer, stable for programs), or none"
          enum:
            - labels
            - names
            - none
          type: string
      type: object
    ExportInput:
      additionalProperties: false
      properties:
        data_source:
          description: the data source a SQL query runs against
          type: string
        dataset:
          description: the dataset an AQL query runs against
          type: string
        filename:
          description: the file's name, as a download saves it, with the format's extension added when it has none; when unset or blank, the dataset's or data source's name
          type: string
        format:
          default: csv
          description: the file's format
          enum:
            - csv
          type: string
        format_options:
          $ref: "#/components/schemas/ExportFormatOptions"
          description: the format's options
        input:
          $ref: "#/components/schemas/QueryTransforms"
          description: "the Query Input: filters, conditions, sorts and date drills applied to the AQL before it compiles"
        lang:
          default: aql
          description: the language the query is written in
          enum:
            - aql
            - sql
          type: string
        query:
          description: the query
          minLength: 1
          type: string
        timezone:
          description: the IANA time zone relative dates and date truncation use, such as Asia/Ho_Chi_Minh
          type: string
      required:
        - query
      type: object
    ExportLink:
      additionalProperties: false
      properties:
        expires_at:
          description: when the link stops working
          format: date-time
          type: string
        filename:
          description: the file's name, as a download saves it
          type: string
        format:
          description: the file's format
          type: string
        row_count:
          description: the rows the file holds
          format: int64
          type: integer
        url:
          description: "where to download the file: a plain GET, with no credentials, until expires_at"
          type: string
      required:
        - url
        - filename
        - format
        - row_count
        - expires_at
      type: object
    IngestInput:
      additionalProperties: false
      properties:
        source:
          description: optional context source key to ingest
          type: string
      type: object
    NoInput:
      additionalProperties: false
      type: object
    QueryCondition:
      additionalProperties: false
      properties:
        expr:
          description: an AQL condition
          type: string
      required:
        - expr
      type: object
    QueryDateDrill:
      additionalProperties: false
      properties:
        field:
          description: "model.field: a date field"
          type: string
        grain:
          description: the grain, such as month
          type: string
      required:
        - field
        - grain
      type: object
    QueryFilter:
      additionalProperties: false
      properties:
        aggregation:
          description: the condition applies to this aggregate of field, such as sum
          type: string
        field:
          description: model.field for a dataset field, or the name of a dataset metric
          type: string
        modifier:
          description: the date unit of a relative operator, such as day
          type: string
        operator:
          description: the operator, such as is, contains, between, last
          type: string
        values:
          description: "the operator's values: strings, numbers or booleans; empty for an operator that takes none"
          items: {}
          type: array
      required:
        - field
        - operator
        - values
      type: object
    QueryInput:
      additionalProperties: false
      properties:
        data_source:
          description: the data source a SQL query runs against
          type: string
        dataset:
          description: the dataset an AQL query runs against
          type: string
        lang:
          default: aql
          description: the language the query is written in
          enum:
            - aql
            - sql
          type: string
        query:
          description: the query
          minLength: 1
          type: string
      required:
        - query
      type: object
    QueryResult:
      additionalProperties: false
      properties:
        aql:
          description: "the AQL that ran: the query with its Query Input applied; absent for a SQL query"
          type: string
        columns:
          description: one per field of result, in order
          items:
            $ref: "#/components/schemas/ExploreColumn"
          type: array
        result:
          $ref: "#/components/schemas/QueryRows"
        sql:
          type: string
      required:
        - sql
        - columns
        - result
      type: object
    QueryRows:
      additionalProperties: false
      properties:
        fields:
          items:
            type: string
          type: array
        records:
          items:
            items: {}
            type: array
          type: array
      required:
        - fields
        - records
      type: object
    QueryRunInput:
      additionalProperties: false
      properties:
        data_source:
          description: the data source a SQL query runs against
          type: string
        dataset:
          description: the dataset an AQL query runs against
          type: string
        input:
          $ref: "#/components/schemas/QueryTransforms"
          description: "the Query Input: filters, conditions, sorts and date drills applied to the AQL before it compiles"
        lang:
          default: aql
          description: the language the query is written in
          enum:
            - aql
            - sql
          type: string
        page:
          description: the 1-based page of rows to answer; needs a page size
          format: int64
          minimum: 1
          type: integer
        page_size:
          description: rows per page; alone, the first page
          format: int64
          minimum: 1
          type: integer
        query:
          description: the query
          minLength: 1
          type: string
        timezone:
          description: the IANA time zone relative dates and date truncation use, such as Asia/Ho_Chi_Minh
          type: string
      required:
        - query
      type: object
    QuerySort:
      additionalProperties: false
      properties:
        direction:
          description: the direction
          enum:
            - asc
            - desc
          type: string
        field:
          description: a result column's name
          type: string
      required:
        - field
        - direction
      type: object
    QueryTransforms:
      additionalProperties: false
      properties:
        conditions:
          description: AQL conditions ANDed with the query's own filters
          items:
            $ref: "#/components/schemas/QueryCondition"
          type: array
        dateDrills:
          description: date fields redrawn at another grain, their columns' names kept
          items:
            $ref: "#/components/schemas/QueryDateDrill"
          type: array
        filters:
          description: conditions on fields, ANDed with the query's own filters
          items:
            $ref: "#/components/schemas/QueryFilter"
          type: array
        sorts:
          description: sorts by result column, replacing the query's own
          items:
            $ref: "#/components/schemas/QuerySort"
          type: array
      type: object
    QueryValidation:
      additionalProperties: false
      properties:
        diagnostics:
          items:
            $ref: "#/components/schemas/AQLDiagnostic"
          type: array
        valid:
          type: boolean
      required:
        - valid
        - diagnostics
      type: object
    RepoValidation:
      additionalProperties: false
      properties:
        diagnostics:
          items:
            $ref: "#/components/schemas/CompileError"
          type: array
        reports:
          items:
            $ref: "#/components/schemas/ValidationReport"
          type: array
        valid:
          type: boolean
      required:
        - valid
        - diagnostics
        - reports
      type: object
    ReportTrace:
      additionalProperties: false
      properties:
        kind:
          type: string
        loc:
          $ref: "#/components/schemas/ReportTraceLoc"
        name:
          type: string
      required:
        - kind
        - name
      type: object
    ReportTraceLoc:
      additionalProperties: false
      properties:
        column:
          format: int64
          type: integer
        filePath:
          type: string
        line:
          format: int64
          type: integer
      required:
        - filePath
      type: object
    SearchInput:
      additionalProperties: false
      properties:
        query:
          description: search query
          items:
            type: string
          type: array
      type: object
    ServerInfo:
      additionalProperties: false
      properties:
        instance_id:
          type: string
        url:
          type: string
        version:
          type: string
      required:
        - url
        - instance_id
        - version
      type: object
    ShowDataset:
      additionalProperties: false
      properties:
        description:
          type: string
        fqn:
          description: the dataset's fully qualified name, as AQL and the catalog name it
          type: string
        kind:
          enum:
            - dataset
          type: string
        label:
          type: string
        metrics:
          description: the dataset's metrics; absent in outline
          items:
            $ref: "#/components/schemas/ShowField"
          type: array
        models:
          description: the models the dataset uses; absent in outline
          items:
            $ref: "#/components/schemas/ShowModel"
          type: array
        name:
          type: string
      required:
        - kind
        - fqn
        - name
      type: object
    ShowField:
      additionalProperties: false
      properties:
        aggregation:
          description: a measure's aggregation, such as sum or count distinct; custom for a custom one
          type: string
        definedInDataset:
          description: a dimension the dataset declares on one of its models
          type: boolean
        definition:
          description: the definition of a field or metric written in AQL
          type: string
        description:
          type: string
        format:
          description: how a value displays, as the AML declares it
        fqn:
          description: "the catalog's identity: <model fqn>.<name>, or <dataset fqn>.<name> for a dataset-level field or a metric"
          type: string
        hidden:
          type: boolean
        label:
          type: string
        name:
          description: AQL writes <model fqn>.<name>; a metric, its name alone
          type: string
        role:
          enum:
            - dimension
            - measure
            - param
            - metric
          type: string
        type:
          description: the compiled data type, such as number, text, date, datetime, truefalse
          type: string
      required:
        - fqn
        - name
        - role
        - type
        - hidden
      type: object
    ShowInput:
      additionalProperties: false
      properties:
        fqn:
          description: the fqn of the object to show; absent, the repo
          type: string
        type:
          default: aml.dataset
          description: the catalog's entity type of fqn; aml.dataset is the only one for now
          enum:
            - aml.dataset
          type: string
      type: object
    ShowModel:
      additionalProperties: false
      properties:
        description:
          type: string
        fields:
          items:
            $ref: "#/components/schemas/ShowField"
          type: array
        fqn:
          description: "the model's fully qualified name: what AQL writes before a field"
          type: string
        label:
          type: string
        name:
          type: string
      required:
        - fqn
        - name
        - fields
      type: object
    ShowRepo:
      additionalProperties: false
      properties:
        datasets:
          description: the repo's datasets, each in full; in outline (no models or metrics) when it cannot be shown in full, which a diagnostic says why
          items:
            $ref: "#/components/schemas/ShowDataset"
          type: array
        kind:
          enum:
            - repo
          type: string
      required:
        - kind
        - datasets
      type: object
    ShowResult:
      additionalProperties: false
      properties:
        diagnostics:
          description: "what is wrong in the repo for what is shown: its files that do not compile, a dataset's data source it does not configure, a dataset it cannot show in full; empty, what is shown is complete"
          items:
            $ref: "#/components/schemas/CompileError"
          type: array
        object:
          description: the object shown, by kind; a client must accept a kind it does not know
          discriminator:
            mapping:
              dataset: "#/components/schemas/ShowDataset"
              repo: "#/components/schemas/ShowRepo"
            propertyName: kind
          oneOf:
            - $ref: "#/components/schemas/ShowRepo"
            - $ref: "#/components/schemas/ShowDataset"
      required:
        - object
        - diagnostics
      type: object
    SidecarHealth:
      additionalProperties: false
      properties:
        canal-query:
          type: string
        node:
          type: string
      required:
        - node
        - canal-query
      type: object
    StatusResult:
      additionalProperties: false
      properties:
        server:
          $ref: "#/components/schemas/ServerInfo"
        sidecars:
          $ref: "#/components/schemas/SidecarHealth"
        state:
          enum:
            - healthy
            - degraded
            - not_running
          type: string
      required:
        - state
      type: object
    UpdateInfo:
      additionalProperties: false
      properties:
        available:
          type: boolean
        latest:
          type: string
      required:
        - latest
        - available
      type: object
    ValidateInput:
      additionalProperties: false
      properties:
        globs:
          description: optional file globs; report only diagnostics for matching files
          items:
            type: string
          type: array
      type: object
    ValidationReport:
      additionalProperties: false
      properties:
        code: {}
        filePath:
          type: string
        fqn:
          type: string
        message:
          type: string
        severity:
          type: string
        trace:
          items:
            $ref: "#/components/schemas/ReportTrace"
          type: array
        type:
          type: string
        validator:
          type: string
      required:
        - validator
        - filePath
        - type
        - fqn
        - severity
        - message
      type: object
    VersionResult:
      additionalProperties: false
      properties:
        update:
          $ref: "#/components/schemas/UpdateInfo"
        version:
          type: string
      required:
        - version
      type: object
    Violation:
      additionalProperties: false
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
      required:
        - field
        - code
        - message
      type: object
    Violations:
      additionalProperties: false
      properties:
        violations:
          items:
            $ref: "#/components/schemas/Violation"
          type: array
      required:
        - violations
      type: object
info:
  title: anfra
  version: "0"
openapi: 3.1.0
paths:
  /core.ingest:
    post:
      operationId: core.ingest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Build the local search catalog from context sources
      x-destructive: true
      x-idempotent: true
      x-read-only: false
  /core.query:
    post:
      operationId: core.query
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRunInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    oneOf:
                      - $ref: "#/components/schemas/ErrorBodyValidationFailed"
                      - $ref: "#/components/schemas/ErrorBodyQueryInvalid"
                required:
                  - error
                type: object
          description: validation_failed, query_invalid
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "502":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyQueryFailed"
                required:
                  - error
                type: object
          description: query_failed
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: "Run a query: its rows, and the SQL that produced them"
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /core.query.compile:
    post:
      operationId: core.query.compile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRunInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompiledQuery"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    oneOf:
                      - $ref: "#/components/schemas/ErrorBodyValidationFailed"
                      - $ref: "#/components/schemas/ErrorBodyQueryInvalid"
                required:
                  - error
                type: object
          description: validation_failed, query_invalid
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Compile a query to SQL, without running it
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /core.query.export:
    post:
      description: |-
        Export a query's whole result as a file: a link to download it.

        The query runs to completion before the answer, so a query that fails fails here. The CLI downloads the file, to stdout or --output; --link prints the answer instead.
      operationId: core.query.export
      requestBody:
        content:
          application/json:
            schema:
