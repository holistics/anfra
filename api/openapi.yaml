components:
  schemas:
    AQLDiagnostic:
      additionalProperties: false
      properties:
        column:
          format: int64
          type: integer
        line:
          format: int64
          type: integer
        message:
          type: string
        severity:
          type: string
      required:
        - message
        - severity
      type: object
    CompileError:
      additionalProperties: false
      properties:
        col:
          format: int64
          type: integer
        filePath:
          type: string
        message:
          type: string
        row:
          format: int64
          type: integer
      required:
        - message
      type: object
    CompiledQuery:
      additionalProperties: false
      properties:
        sql:
          type: string
      required:
        - sql
      type: object
    ContextEntry:
      additionalProperties: false
      properties:
        params:
          additionalProperties: {}
          type: object
        step:
          type: string
        text:
          type: string
      required:
        - step
        - text
      type: object
    ErrorBodyInternalServerError:
      additionalProperties: false
      description: Something went wrong on our side.
      properties:
        code:
          const: internal_server_error
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 500
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyInvalidRequest:
      additionalProperties: false
      description: The request is not valid.
      properties:
        code:
          const: invalid_request
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          items:
            $ref: "#/components/schemas/Violation"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: client
          type: string
        status:
          const: 400
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyQueryFailed:
      additionalProperties: false
      description: The query failed to run on its data source.
      properties:
        code:
          const: query_failed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 502
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyQueryInvalid:
      additionalProperties: false
      description: The query is invalid.
      properties:
        code:
          const: query_invalid
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/QueryValidation"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodySidecarUnavailable:
      additionalProperties: false
      description: A sidecar is unavailable.
      properties:
        code:
          const: sidecar_unavailable
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 503
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyValidationFailed:
      additionalProperties: false
      description: Some of the input is not valid.
      properties:
        code:
          const: validation_failed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          items:
            $ref: "#/components/schemas/Violation"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    IngestInput:
      additionalProperties: false
      properties:
        source:
          description: optional context source key to ingest
          type: string
      type: object
    NoInput:
      additionalProperties: false
      type: object
    QueryInput:
      additionalProperties: false
      oneOf:
        - properties:
            dataset: {}
          required:
            - dataset
          type: object
        - properties:
            data_source: {}
          required:
            - data_source
          type: object
      properties:
        data_source:
          description: the data source to query (SQL)
          type: string
        dataset:
          description: the dataset to query (AQL)
          type: string
        lang:
          default: aql
          description: the language the query is written in
          enum:
            - aql
            - sql
          type: string
        query:
          description: the query
          minLength: 1
          type: string
      required:
        - query
      type: object
    QueryResult:
      additionalProperties: false
      properties:
        result:
          $ref: "#/components/schemas/QueryRows"
        sql:
          type: string
      required:
        - sql
        - result
      type: object
    QueryRows:
      additionalProperties: false
      properties:
        fields:
          items:
            type: string
          type: array
        records:
          items:
            items: {}
            type: array
          type: array
      required:
        - fields
        - records
      type: object
    QueryValidation:
      additionalProperties: false
      properties:
        diagnostics:
          items:
            $ref: "#/components/schemas/AQLDiagnostic"
          type: array
        valid:
          type: boolean
      required:
        - valid
        - diagnostics
      type: object
    RepoValidation:
      additionalProperties: false
      properties:
        compileErrors:
          items:
            $ref: "#/components/schemas/CompileError"
          type: array
        reports:
          items:
            $ref: "#/components/schemas/ValidationReport"
          type: array
        valid:
          type: boolean
      required:
        - valid
        - compileErrors
        - reports
      type: object
    ReportTrace:
      additionalProperties: false
      properties:
        kind:
          type: string
        loc:
          $ref: "#/components/schemas/ReportTraceLoc"
        name:
          type: string
      required:
        - kind
        - name
      type: object
    ReportTraceLoc:
      additionalProperties: false
      properties:
        column:
          format: int64
          type: integer
        filePath:
          type: string
        line:
          format: int64
          type: integer
      required:
        - filePath
      type: object
    SearchInput:
      additionalProperties: false
      properties:
        query:
          description: search query
          items:
            type: string
          type: array
      type: object
    ServerInfo:
      additionalProperties: false
      properties:
        instance_id:
          type: string
        url:
          type: string
        version:
          type: string
      required:
        - url
        - instance_id
        - version
      type: object
    SidecarHealth:
      additionalProperties: false
      properties:
        canal-query:
          type: string
        node:
          type: string
      required:
        - node
        - canal-query
      type: object
    StatusResult:
      additionalProperties: false
      properties:
        server:
          $ref: "#/components/schemas/ServerInfo"
        sidecars:
          $ref: "#/components/schemas/SidecarHealth"
        state:
          enum:
            - healthy
            - degraded
            - not_running
          type: string
      required:
        - state
      type: object
    ValidateInput:
      additionalProperties: false
      properties:
        globs:
          description: optional file globs; report only diagnostics for matching files
          items:
            type: string
          type: array
      type: object
    ValidationReport:
      additionalProperties: false
      properties:
        code: {}
        filePath:
          type: string
        fqn:
          type: string
        message:
          type: string
        severity:
          type: string
        trace:
          items:
            $ref: "#/components/schemas/ReportTrace"
          type: array
        type:
          type: string
        validator:
          type: string
      required:
        - validator
        - filePath
        - type
        - fqn
        - severity
        - message
      type: object
    VersionResult:
      additionalProperties: false
      properties:
        version:
          type: string
      required:
        - version
      type: object
    Violation:
      additionalProperties: false
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
      required:
        - field
        - code
        - message
      type: object
info:
  title: anfra
  version: "0"
openapi: 3.1.0
paths:
  /core.ingest:
    post:
      operationId: core.ingest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Build the local search catalog from context sources
      x-idempotent: true
      x-read-only: false
  /core.query:
    post:
      operationId: core.query
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    oneOf:
                      - $ref: "#/components/schemas/ErrorBodyValidationFailed"
                      - $ref: "#/components/schemas/ErrorBodyQueryInvalid"
                required:
                  - error
                type: object
          description: validation_failed, query_invalid
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "502":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyQueryFailed"
                required:
                  - error
                type: object
          description: query_failed
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: "Run a query: its rows, and the SQL that produced them"
      x-idempotent: true
      x-read-only: true
  /core.query.compile:
    post:
      operationId: core.query.compile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompiledQuery"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    oneOf:
                      - $ref: "#/components/schemas/ErrorBodyValidationFailed"
                      - $ref: "#/components/schemas/ErrorBodyQueryInvalid"
                required:
                  - error
                type: object
          description: validation_failed, query_invalid
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Compile a query to SQL, without running it
      x-idempotent: true
      x-read-only: true
  /core.query.validate:
    post:
      operationId: core.query.validate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryValidation"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: "Validate a query: its diagnostics, without running it"
      x-idempotent: true
      x-read-only: true
  /core.search:
    post:
      operationId: core.search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Search the local catalog
      x-idempotent: true
      x-read-only: true
  /core.status:
    post:
      operationId: core.status
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
      summary: Report whether a warm server is running and its sidecars are healthy
      x-idempotent: true
      x-read-only: true
  /core.validate:
    post:
      operationId: core.validate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoValidation"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Validate the AML repo, optionally scoped to file globs
      x-idempotent: true
      x-read-only: true
  /core.version:
    post:
      operationId: core.version
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
      summary: Print the anfra version
      x-idempotent: true
      x-read-only: true
servers:
  - url: /api
