components:
  schemas:
    AQLDiagnostic:
      additionalProperties: false
      properties:
        column:
          format: int64
          type: integer
        line:
          format: int64
          type: integer
        message:
          type: string
        severity:
          type: string
      required:
        - message
        - severity
      type: object
    Column:
      additionalProperties: false
      properties:
        adhoc:
          description: a query-local expression, not a field the dataset defines
          type: boolean
        aggregation:
          description: an aggregated field's aggregation, such as sum or count distinct
          type: string
        arrow_type:
          additionalProperties: true
          description: the Arrow type canal-query read the values as, by which they are written; absent before the query runs
          properties:
            label:
              description: "the type as arrow-go spells it, such as decimal(38, 2): for people, not to decide on"
              type: string
            type:
              description: "the type's name, as Schema.fbs's Type union names it, in snake_case: int, floating_point, decimal, utf8, bool, date, timestamp, list, struct, ..."
              type: string
          required:
            - type
            - label
          type: object
        db_type:
          description: "the database's own name of the column's type: for debugging, never to decide on, since it varies by database and driver; absent before the query runs"
          type: string
        fieldName:
          description: the field it draws; for an adhoc column, its name
          type: string
        isMeasure:
          type: boolean
        label:
          type: string
        modelId:
          description: the model of fieldName, as the dataset names it; absent for a dataset metric or an adhoc column
          type: string
        name:
          description: the column's key, as in fields
          type: string
        semantic_type:
          description: "what the column's values mean, in AML's types, plus bit: a true or false stored as a bit, written as true and false or as \"1\" and \"0\" by how the database produced it. Decide by it. Absent when no AQL types the column (a SQL query, or AQL that is not an explore): see arrow_type. Unknown when its AQL type has no meaning in AML (time, duration, ...)"
          enum:
            - bit
            - date
            - datetime
            - json
            - number
            - text
            - truefalse
            - unknown
          type: string
      required:
        - name
        - fieldName
        - label
        - adhoc
        - isMeasure
      type: object
    CompileError:
      additionalProperties: false
      properties:
        col:
          format: int64
          type: integer
        filePath:
          type: string
        message:
          type: string
        row:
          format: int64
          type: integer
      required:
        - message
      type: object
    CompiledQuery:
      additionalProperties: false
      properties:
        aql:
          description: "the AQL compiled: the query with its Query Input applied; absent for a SQL query"
          type: string
        columns:
          description: what each column of an explore query's answer will be, and its semantic type; absent for other queries
          items:
            $ref: "#/components/schemas/Column"
          type: array
        sql:
          type: string
      required:
        - sql
      type: object
    ContextEntry:
      additionalProperties: false
      properties:
        params:
          additionalProperties: {}
          type: object
        step:
          type: string
        text:
          type: string
      required:
        - step
        - text
      type: object
    Diagram:
      additionalProperties: false
      properties:
        cards:
          description: every card, in layer order
          items:
            $ref: "#/components/schemas/DiagramCard"
          type: array
        layers:
          description: the cards in layers, upstream first
          items:
            $ref: "#/components/schemas/DiagramLayer"
          type: array
        matched:
          description: the ids of this page's matched entities, in search order
          items:
            type: string
          type: array
        query:
          description: the catalog search the lineage is
          type: string
        schema:
          $ref: "#/components/schemas/DiagramSchema"
        total:
          description: how many entities the search matched, over every page
          format: int64
          type: integer
        version:
          enum:
            - 2
          format: int64
          type: integer
      required:
        - version
        - query
        - total
        - matched
        - schema
        - layers
        - cards
      type: object
    DiagramCard:
      additionalProperties: false
      properties:
        detached:
          description: its type is not a top-level one, but its container is not in the lineage
          type: boolean
        id:
          description: the catalog's id of the entity
          type: string
        label:
          type: string
        layer:
          format: int64
          type: integer
        links:
          description: the node's links; a link is on its edge's from entity
          items:
            $ref: "#/components/schemas/DiagramLink"
          type: array
        props:
          additionalProperties: {}
          description: the entity's properties
          type: object
        ref:
          description: the entity this node is a copy of
          type: string
        sections:
          description: the node's children, grouped by type
          items:
            $ref: "#/components/schemas/DiagramSection"
          type: array
        tags:
          items:
            type: string
          type: array
        type:
          description: the catalog's entity type, such as aml.model or aml.metric
          type: string
      required:
        - layer
        - id
        - type
        - label
      type: object
    DiagramLayer:
      additionalProperties: false
      properties:
        card_ids:
          items:
            type: string
          type: array
        index:
          format: int64
          type: integer
        types:
          description: the entity types of its cards
          items:
            type: string
          type: array
      required:
        - index
        - types
        - card_ids
      type: object
    DiagramLink:
      additionalProperties: false
      properties:
        props:
          additionalProperties: {}
          description: the edge's properties, when it has some
          type: object
        to:
          description: the linked entity's id
          type: string
        type:
          description: the edge type, such as refers or includes
          type: string
      required:
        - type
        - to
      type: object
    DiagramNode:
      additionalProperties: false
      properties:
        id:
          description: the catalog's id of the entity
          type: string
        label:
          type: string
        links:
          description: the node's links; a link is on its edge's from entity
          items:
            $ref: "#/components/schemas/DiagramLink"
          type: array
        props:
          additionalProperties: {}
          description: the entity's properties
          type: object
        ref:
          description: the entity this node is a copy of
          type: string
        sections:
          description: the node's children, grouped by type
          items:
            $ref: "#/components/schemas/DiagramSection"
          type: array
        tags:
          items:
            type: string
          type: array
        type:
          description: the catalog's entity type, such as aml.model or aml.metric
          type: string
      required:
        - id
        - type
        - label
      type: object
    DiagramSchema:
      additionalProperties: false
      properties:
        edges:
          additionalProperties:
            type: string
          description: edge type → what it means
          type: object
        types:
          additionalProperties:
            $ref: "#/components/schemas/DiagramSchemaType"
          description: entity type → how it connects
          type: object
      required:
        - edges
        - types
      type: object
    DiagramSchemaType:
      additionalProperties: false
      properties:
        edges:
          additionalProperties:
            items:
              type: string
            type: array
          description: edge type → the entity types it links to
          type: object
        top_level:
          description: no entity of the type is a child in a section
          type: boolean
      required:
        - top_level
        - edges
      type: object
    DiagramSection:
      additionalProperties: false
      properties:
        nodes:
          items:
            $ref: "#/components/schemas/DiagramNode"
          type: array
        type:
          type: string
      required:
        - type
        - nodes
      type: object
    ErrorBodyExportsUnavailable:
      additionalProperties: false
      description: This server cannot make exports.
      properties:
        code:
          const: exports_unavailable
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 501
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyInternalServerError:
      additionalProperties: false
      description: Something went wrong on our side.
      properties:
        code:
          const: internal_server_error
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 500
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyInvalidRequest:
      additionalProperties: false
      description: The request is not valid.
      properties:
        code:
          const: invalid_request
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/Violations"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: client
          type: string
        status:
          const: 400
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyPageTooLarge:
      additionalProperties: false
      description: The page is larger than this server answers at once.
      properties:
        code:
          const: page_too_large
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/PageLimit"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyQueryFailed:
      additionalProperties: false
      description: The query failed to run on its data source.
      properties:
        code:
          const: query_failed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyQueryInvalid:
      additionalProperties: false
      description: The query is invalid.
      properties:
        code:
          const: query_invalid
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/QueryValidation"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyResultTooLarge:
      additionalProperties: false
      description: The query's result is larger than this server allows.
      properties:
        code:
          const: result_too_large
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/ResultLimit"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodySidecarUnavailable:
      additionalProperties: false
      description: A sidecar is unavailable.
      properties:
        code:
          const: sidecar_unavailable
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 503
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyValidationFailed:
      additionalProperties: false
      description: Some of the input is not valid.
      properties:
        code:
          const: validation_failed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/Violations"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ExportFormatOptions:
      additionalProperties: false
      properties:
        bom:
          description: "csv: start the file with a UTF-8 byte-order mark, which Excel needs to read non-ASCII text; set it for a file a person will open"
          type: boolean
        header:
          description: "csv: the header row: the columns' labels (the default; what readers see), their names (their keys in a query's answer, stable for programs), or none"
          enum:
            - labels
            - names
            - none
          type: string
      type: object
    ExportInput:
      additionalProperties: false
      properties:
        data_source:
          description: the data source a SQL query runs against
          type: string
        dataset:
          description: the dataset an AQL query runs against
          type: string
        filename:
          description: the file's name, as a download saves it, with the format's extension added when it has none; when unset or blank, the dataset's or data source's name
          type: string
        format:
          default: csv
          description: the file's format
          enum:
            - csv
          type: string
        format_options:
          $ref: "#/components/schemas/ExportFormatOptions"
          description: the format's options
        input:
          $ref: "#/components/schemas/QueryTransforms"
          description: "the Query Input: filters, conditions, sorts and date drills applied to the AQL before it compiles"
        lang:
          default: aql
          description: the language the query is written in
          enum:
            - aql
            - sql
          type: string
        query:
          description: the query
          minLength: 1
          type: string
        timezone:
          description: the IANA time zone relative dates and date truncation use, such as Asia/Ho_Chi_Minh
          type: string
      required:
        - query
      type: object
    ExportLink:
      additionalProperties: false
      properties:
        expires_at:
          description: when the link stops working
          format: date-time
          type: string
        filename:
          description: the file's name, as a download saves it
          type: string
        format:
          description: the file's format
          type: string
        row_count:
          description: the rows the file holds
          format: int64
          type: integer
        url:
          description: "where to download the file: a plain GET, with no credentials, until expires_at"
          type: string
      required:
        - url
        - filename
        - format
        - row_count
        - expires_at
      type: object
    FieldLineage:
      additionalProperties: false
      properties:
        diagram:
          $ref: "#/components/schemas/Diagram"
          description: the field's lineage; absent with error
        error:
          description: why the field's lineage could not be traced
          type: string
        query:
          description: the catalog search its lineage is, which search also takes; empty when the field could not be searched for
          type: string
        target:
          $ref: "#/components/schemas/LineageTarget"
          description: the field, as asked
      required:
        - target
        - query
      type: object
    IngestInput:
      additionalProperties: false
      properties:
        source:
          description: optional context source key to ingest
          type: string
      type: object
    LineageInput:
      additionalProperties: false
      properties:
        limit:
          description: at most this many upstream entities per field; absent, all of them
          format: int64
          minimum: 1
          type: integer
        offset:
          description: skip this many upstream entities first, to page with limit
          format: int64
          minimum: 0
          type: integer
        targets:
          description: "the fields to trace, each by its parent and its name in it: {\"parent\": \"orders\", \"child\": \"amount\"}"
          items:
            $ref: "#/components/schemas/LineageTarget"
          type: array
      type: object
    LineageResult:
      additionalProperties: false
      properties:
        results:
          items:
            $ref: "#/components/schemas/FieldLineage"
          type: array
      required:
        - results
      type: object
    LineageTarget:
      additionalProperties: false
      properties:
        child:
          description: "the field's name in its parent: a dimension, a measure or a metric"
          minLength: 1
          type: string
        parent:
          description: "the fqn of what holds the field: a model, or a dataset"
          minLength: 1
          type: string
      required:
        - parent
        - child
      type: object
    NoInput:
      additionalProperties: false
      type: object
    PageLimit:
      additionalProperties: false
      properties:
        max_bytes:
          format: int64
          type: integer
      required:
        - max_bytes
      type: object
    QueryCompiled:
      additionalProperties: false
      properties:
        aql:
          description: "the AQL that runs: the query with its Query Input applied; absent for a SQL query"
          type: string
        sql:
          type: string
        type:
          enum:
            - compiled
          type: string
      required:
        - type
        - sql
      type: object
    QueryCondition:
      additionalProperties: false
      properties:
        expr:
          description: an AQL condition
          type: string
      required:
        - expr
      type: object
    QueryDateDrill:
      additionalProperties: false
      properties:
        field:
          description: "model.field: a date field"
          type: string
        grain:
          description: the grain, such as month
          type: string
      required:
        - field
        - grain
      type: object
    QueryFilter:
      additionalProperties: false
      properties:
        aggregation:
          description: the condition applies to this aggregate of field, such as sum
          type: string
        field:
          description: model.field for a dataset field, or the name of a dataset metric
          type: string
        modifier:
          description: the date unit of a relative operator, such as day
          type: string
        operator:
          description: the operator, such as is, contains, between, last
          type: string
        values:
          description: "the operator's values, by the field's type: a number as a string in JSON's number syntax, such as \"9007199254740993\" (a JSON number is refused, since it may have lost digits before it was sent); true or false; a date or text as a string. Empty for an operator that takes none"
          items: {}
          type: array
      required:
        - field
        - operator
        - values
      type: object
    QueryHeader:
      additionalProperties: false
      properties:
        columns:
          description: one per field, in order
          items:
            $ref: "#/components/schemas/Column"
          type: array
        fields:
          items:
            type: string
          type: array
        type:
          enum:
            - header
          type: string
      required:
        - type
        - columns
        - fields
      type: object
    QueryInput:
      additionalProperties: false
      properties:
        data_source:
          description: the data source a SQL query runs against
          type: string
        dataset:
          description: the dataset an AQL query runs against
          type: string
        lang:
          default: aql
          description: the language the query is written in
          enum:
            - aql
            - sql
          type: string
        query:
          description: the query
          minLength: 1
          type: string
      required:
        - query
      type: object
    QueryRecords:
      additionalProperties: false
      properties:
        records:
          description: one array per row, its values in fields' order, written as a page's records are
          items:
            items: {}
            type: array
          type: array
        type:
          enum:
            - rows
          type: string
      required:
        - type
        - records
      type: object
    QueryResult:
      additionalProperties: false
      properties:
        aql:
          description: "the AQL that ran: the query with its Query Input applied; absent for a SQL query"
          type: string
        columns:
          description: one per field of result, in order
          items:
            $ref: "#/components/schemas/Column"
          type: array
        has_more:
          description: "there may be rows after this page: ask for the next page, or stream the query (without page_size) for every row"
          type: boolean
        result:
          $ref: "#/components/schemas/QueryRows"
        sql:
          type: string
        timings:
          $ref: "#/components/schemas/Timings"
          description: "the query's steps: compiling_query, for AQL; canal-query's own (connecting_to_dw, executing_query, fetching_query_result, and their children, as <parent>.<child>); retrying_query, the wait before canal-query attempts the query again"
      required:
        - sql
        - columns
        - result
        - has_more
        - timings
      type: object
    QueryRows:
      additionalProperties: false
      properties:
        fields:
          items:
            type: string
          type: array
        records:
          description: "one array per row, its values in fields' order, as its column's types say: every number a string, with every digit (a JSON number loses some in JavaScript), a float's NaN and infinities as \"NaN\", \"Infinity\" and \"-Infinity\", and so at any depth of a list, map or struct; null as null"
          items:
            items: {}
            type: array
          type: array
      required:
        - fields
        - records
      type: object
    QueryRunInput:
      additionalProperties: false
      properties:
        data_source:
          description: the data source a SQL query runs against
          type: string
        dataset:
          description: the dataset an AQL query runs against
          type: string
        input:
          $ref: "#/components/schemas/QueryTransforms"
          description: "the Query Input: filters, conditions, sorts and date drills applied to the AQL before it compiles"
        lang:
          default: aql
          description: the language the query is written in
          enum:
            - aql
            - sql
          type: string
        page:
          description: the 1-based page of rows to answer; needs a page size
          format: int64
          minimum: 1
          type: integer
        page_size:
          description: rows per page; alone, the first page
          format: int64
          maximum: 10000
          minimum: 1
          type: integer
        query:
          description: the query
          minLength: 1
          type: string
        timezone:
          description: the IANA time zone relative dates and date truncation use, such as Asia/Ho_Chi_Minh
          type: string
      required:
        - query
      type: object
    QuerySort:
      additionalProperties: false
      properties:
        direction:
          description: the direction
          enum:
            - asc
            - desc
          type: string
        field:
          description: a result column's name
          type: string
      required:
        - field
        - direction
      type: object
    QuerySummary:
      additionalProperties: false
      properties:
        bytes_scanned:
          description: the bytes the warehouse read to run the query, where it reports them (BigQuery, Athena)
          format: int64
          type: integer
        has_more:
          description: "a page that may not be the last: there may be rows after it. Without page_size, every row was sent, and this is false"
          type: boolean
        row_count:
          format: int64
          type: integer
        timings:
          $ref: "#/components/schemas/Timings"
          description: "the query's steps: compiling_query, for AQL; canal-query's own (connecting_to_dw, executing_query, fetching_query_result, and their children, as <parent>.<child>); retrying_query, the wait before canal-query attempts the query again"
        type:
          enum:
            - summary
          type: string
      required:
        - type
        - row_count
        - has_more
        - timings
      type: object
    QueryTransforms:
      additionalProperties: false
      properties:
        conditions:
          description: AQL conditions ANDed with the query's own filters
          items:
            $ref: "#/components/schemas/QueryCondition"
          type: array
        dateDrills:
          description: date fields redrawn at another grain, their columns' names kept
          items:
            $ref: "#/components/schemas/QueryDateDrill"
          type: array
        filters:
          description: conditions on fields, ANDed with the query's own filters
          items:
            $ref: "#/components/schemas/QueryFilter"
          type: array
        sorts:
          description: sorts by result column, replacing the query's own
          items:
            $ref: "#/components/schemas/QuerySort"
          type: array
      type: object
    QueryValidation:
      additionalProperties: false
      properties:
        diagnostics:
          items:
            $ref: "#/components/schemas/AQLDiagnostic"
          type: array
        valid:
          type: boolean
      required:
        - valid
        - diagnostics
      type: object
    QueryWarehouse:
      additionalProperties: false
      properties:
        id:
          description: the warehouse's own id of the query; for Postgres, the process id of the backend running it
          type: string
        type:
          enum:
            - warehouse_query
          type: string
      required:
        - type
        - id
      type: object
    RepoValidation:
      additionalProperties: false
      properties:
        diagnostics:
          items:
            $ref: "#/components/schemas/CompileError"
          type: array
        reports:
          items:
            $ref: "#/components/schemas/ValidationReport"
          type: array
        valid:
          type: boolean
      required:
        - valid
        - diagnostics
        - reports
      type: object
    ReportTrace:
      additionalProperties: false
      properties:
        kind:
          type: string
        loc:
          $ref: "#/components/schemas/ReportTraceLoc"
        name:
          type: string
      required:
        - kind
        - name
      type: object
    ReportTraceLoc:
      additionalProperties: false
      properties:
        column:
          format: int64
          type: integer
        filePath:
          type: string
        line:
          format: int64
          type: integer
      required:
        - filePath
      type: object
    Response:
      additionalProperties: false
      properties:
        code:
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details: {}
        message:
          type: string
        request_id:
          type: string
        scope:
          type: string
        status:
          format: int64
          type: integer
      required:
        - code
        - scope
        - message
        - request_id
      type: object
    ResultLimit:
      additionalProperties: false
      properties:
        max_bytes:
          format: int64
          type: integer
        max_rows:
          format: int64
          type: integer
      type: object
    SearchInput:
      additionalProperties: false
      properties:
        limit:
          description: at most this many entities; absent, 50
          format: int64
          maximum: 100
          minimum: 1
          type: integer
        offset:
          description: skip this many entities first, to page with limit
          format: int64
          minimum: 0
          type: integer
        query:
          description: search query
          items:
            type: string
          type: array
      type: object
    ServerInfo:
      additionalProperties: false
      properties:
        instance_id:
          type: string
        url:
          type: string
        version:
          type: string
      required:
        - url
        - instance_id
        - version
      type: object
    ShowDataset:
      additionalProperties: false
      properties:
        description:
          type: string
        fqn:
          description: the dataset's fully qualified name, as AQL and the catalog name it
          type: string
        kind:
          enum:
            - dataset
          type: string
        label:
          type: string
        metrics:
          description: the dataset's metrics; absent in outline
          items:
            $ref: "#/components/schemas/ShowField"
          type: array
        models:
          description: the models the dataset uses; absent in outline
          items:
            $ref: "#/components/schemas/ShowModel"
          type: array
        name:
          type: string
      required:
        - kind
        - fqn
        - name
      type: object
    ShowField:
      additionalProperties: false
      properties:
        aggregation:
          description: a measure's aggregation, such as sum or count distinct; custom for a custom one
          type: string
        definedInDataset:
          description: a dimension the dataset declares on one of its models
          type: boolean
        definition:
          description: the definition of a field or metric written in AQL
          type: string
        description:
          type: string
        format:
          description: how a value displays, as the AML declares it
        fqn:
          description: "the catalog's identity: <model fqn>.<name>, or <dataset fqn>.<name> for a dataset-level field or a metric"
          type: string
        hidden:
          type: boolean
        label:
          type: string
        name:
          description: AQL writes <model fqn>.<name>; a metric, its name alone
          type: string
        role:
          enum:
            - dimension
            - measure
            - param
            - metric
          type: string
        type:
          description: the compiled data type, such as number, text, date, datetime, truefalse
          type: string
      required:
        - fqn
        - name
        - role
        - type
        - hidden
      type: object
    ShowInput:
      additionalProperties: false
      properties:
        fqn:
          description: the fqn of the object to show; absent, the repo
          type: string
        type:
          default: aml.dataset
          description: the catalog's entity type of fqn; aml.dataset is the only one for now
          enum:
            - aml.dataset
          type: string
      type: object
    ShowModel:
      additionalProperties: false
      properties:
        description:
          type: string
        fields:
          items:
            $ref: "#/components/schemas/ShowField"
          type: array
        fqn:
          description: "the model's fully qualified name: what AQL writes before a field"
          type: string
        label:
          type: string
        name:
          type: string
      required:
        - fqn
        - name
        - fields
      type: object
    ShowRepo:
      additionalProperties: false
      properties:
        datasets:
          description: the repo's datasets, each in full; in outline (no models or metrics) when it cannot be shown in full, which a diagnostic says why
          items:
            $ref: "#/components/schemas/ShowDataset"
          type: array
        kind:
          enum:
            - repo
          type: string
      required:
        - kind
        - datasets
      type: object
    ShowResult:
      additionalProperties: false
      properties:
        diagnostics:
          description: "what is wrong in the repo for what is shown: its files that do not compile, a dataset's data source it does not configure, a dataset it cannot show in full; empty, what is shown is complete"
          items:
            $ref: "#/components/schemas/CompileError"
          type: array
        object:
          description: the object shown, by kind; a client must accept a kind it does not know
          discriminator:
            mapping:
              dataset: "#/components/schemas/ShowDataset"
              repo: "#/components/schemas/ShowRepo"
            propertyName: kind
          oneOf:
            - $ref: "#/components/schemas/ShowRepo"
            - $ref: "#/components/schemas/ShowDataset"
      required:
        - object
        - diagnostics
      type: object
    SidecarHealth:
      additionalProperties: false
      properties:
        canal-query:
          type: string
        node:
          type: string
      required:
        - node
        - canal-query
      type: object
    SkillsResult:
      additionalProperties: false
      properties:
        checked:
          type: string
        latest:
          type: string
        version:
          type: string
      type: object
    StatusResult:
      additionalProperties: false
      properties:
        server:
          $ref: "#/components/schemas/ServerInfo"
        sidecars:
          $ref: "#/components/schemas/SidecarHealth"
        state:
          enum:
            - healthy
            - degraded
            - not_running
          type: string
      required:
        - state
      type: object
    StreamEnd:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/Response"
        status:
          enum:
            - succeeded
            - failed
          type: string
        type:
          enum:
            - end
          type: string
      required:
        - type
        - status
      type: object
    StreamPing:
      additionalProperties: false
      properties:
        type:
          enum:
            - ping
          type: string
      required:
        - type
      type: object
    StreamStart:
      additionalProperties: false
      properties:
        id:
          description: the run's id, on a host that keeps a record of runs
          type: string
        type:
          enum:
            - start
          type: string
      required:
        - type
      type: object
    StreamStatus:
      additionalProperties: false
      properties:
        phase:
          type: string
        position:
          description: "while queued: how many runs are ahead of this one, 0 being next; absent otherwise"
          format: int64
          type: integer
        type:
          enum:
            - status
          type: string
      required:
        - type
        - phase
      type: object
    TimedStep:
      additionalProperties: false
      properties:
        start_ms:
          description: when it started, in ms since the run started
          format: int64
          type: integer
        step:
          description: the step's name, as what ran names it; a child step as <parent>.<child>, within its parent
          type: string
      required:
        - step
        - start_ms
      type: object
    Timings:
      additionalProperties: false
      properties:
        end_ms:
          description: "when the run ended, in ms since it started: its total time, and where its last steps end"
          format: int64
          type: integer
        steps:
          description: each step as it started, in order; a step run again is here again
          items:
            $ref: "#/components/schemas/TimedStep"
          type: array
      required:
        - steps
        - end_ms
      type: object
    UpdateInfo:
      additionalProperties: false
      properties:
        available:
          type: boolean
        latest:
          type: string
      required:
        - latest
        - available
      type: object
    ValidateInput:
      additionalProperties: false
      properties:
        globs:
          description: optional file globs, at most 100; report only diagnostics for matching files
          items:
            type: string
          maxItems: 100
          type: array
      type: object
    ValidationReport:
      additionalProperties: false
      properties:
        code: {}
        filePath:
          type: string
        fqn:
          type: string
        message:
          type: string
        severity:
          type: string
        trace:
          items:
            $ref: "#/components/schemas/ReportTrace"
          type: array
        type:
          type: string
        validator:
          type: string
      required:
        - validator
        - filePath
        - type
        - fqn
        - severity
        - message
      type: object
    VersionInput:
      additionalProperties: false
      properties:
        skills:
          description: the version of the anfra skills in use, from the line ending each skill (anfra skills <version>), or unknown when a skill has no such line; adds the latest skills version to the answer
          type: string
      type: object
    VersionResult:
      additionalProperties: false
      properties:
        hints:
          items:
            type: string
          type: array
        skills:
          $ref: "#/components/schemas/SkillsResult"
        update:
          $ref: "#/components/schemas/UpdateInfo"
        version:
          type: string
      required:
        - version
      type: object
    Violation:
      additionalProperties: false
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
      required:
        - field
        - code
        - message
      type: object
    Violations:
      additionalProperties: false
      properties:
        violations:
          items:
            $ref: "#/components/schemas/Violation"
          type: array
      required:
        - violations
      type: object
info:
  title: anfra
  version: "0"
openapi: 3.1.0
paths:
  /core.ingest:
    post:
      operationId: core.ingest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Build the local search catalog from context sources
      x-destructive: true
      x-idempotent: true
      x-read-only: false
  /core.lineage:
    post:
      description: |-
        Trace each field through the local catalog to what it is built from (the fields, models and
        sources upstream of it), as a diagram: cards in layers, upstream first, linked by what uses it.
      operationId: core.lineage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineageInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineageResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: "Trace fields through the local catalog: what each one is built from"
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /core.query:
    post:
      description: |-
        Answers one page of rows: page_size's, or without it the first 10000, with has_more saying whether there may be more.
        Ask the query for what you need (aggregate, filter, a limit: directive) rather than paging through rows; for every row of a large result, export it.
        Over HTTP, a request that accepts application/x-ndjson is answered as the query runs: its phase, its SQL, its columns, then its rows in batches — every row without page_size, up to the server's maximum.
      operationId: core.query
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRunInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
            application/x-ndjson:
              schema:
                discriminator:
                  mapping:
                    compiled: "#/components/schemas/QueryCompiled"
                    end: "#/components/schemas/StreamEnd"
                    header: "#/components/schemas/QueryHeader"
                    ping: "#/components/schemas/StreamPing"
                    rows: "#/components/schemas/QueryRecords"
                    start: "#/components/schemas/StreamStart"
                    status: "#/components/schemas/StreamStatus"
                    summary: "#/components/schemas/QuerySummary"
                    warehouse_query: "#/components/schemas/QueryWarehouse"
                  propertyName: type
                oneOf:
                  - $ref: "#/components/schemas/QueryCompiled"
                  - $ref: "#/components/schemas/QueryWarehouse"
                  - $ref: "#/components/schemas/QueryHeader"
                  - $ref: "#/components/schemas/QueryRecords"
                  - $ref: "#/components/schemas/QuerySummary"
                  - $ref: "#/components/schemas/StreamStart"
                  - $ref: "#/components/schemas/StreamStatus"
                  - $ref: "#/components/schemas/StreamEnd"
                  - $ref: "#/components/schemas/StreamPing"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    oneOf:
                      - $ref: "#/components/schemas/ErrorBodyValidationFailed"
                      - $ref: "#/components/schemas/ErrorBodyQueryInvalid"
                      - $ref: "#/components/schemas/ErrorBodyQueryFailed"
                      - $ref: "#/components/schemas/ErrorBodyResultTooLarge"
                      - $ref: "#/components/schemas/ErrorBodyPageTooLarge"
                required:
                  - error
                type: object
          description: validation_failed, query_invalid, query_failed, result_too_large, page_too_large
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: "Run a query: its rows, and the SQL that produced them"
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /core.query.compile:
    post:
      operationId: core.query.compile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRunInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompiledQuery"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    oneOf:
                      - $ref: "#/components/schemas/ErrorBodyValidationFailed"
                      - $ref: "#/components/schemas/ErrorBodyQueryInvalid"
                required:
                  - error
                type: object
          description: validation_failed, query_invalid
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Compile a query to SQL, without running it
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /core.query.export:
    post:
      description: |-
        Export a query's whole result as a file: a link to download it.

        The query runs to completion before the answer, so a query that fails fails here. The CLI downloads the file, to stdout or --output; --link prints the answer instead.
      operationId: core.query.export
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportLink"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    oneOf:
                      - $ref: "#/components/schemas/ErrorBodyValidationFailed"
                      - $ref: "#/components/schemas/ErrorBodyQueryInvalid"
                      - $ref: "#/components/schemas/ErrorBodyQueryFailed"
                required:
                  - error
                type: object
          description: validation_failed, query_invalid, query_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "501":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyExportsUnavailable"
                required:
                  - error
                type: object
          description: exports_unavailable
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: "Export a query's whole result as a file: a link to download it"
      x-destructive: false
      x-idempotent: false
      x-read-only: false
  /core.query.validate:
    post:
      operationId: core.query.validate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryValidation"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: "Validate a query: its diagnostics, without running it"
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /core.search:
    post:
      operationId: core.search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Search the local catalog
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /core.show:
    post:
      description: |-
        Show an object of the repo, read from its compiled AML: with no fqn, the repo and every dataset
        in full; with a dataset's fqn, that dataset in full, as AQL can query it. Its interface, not its
        implementation: names, labels, types, roles and AQL definitions, never SQL or tables. What is
        wrong in the repo for it comes with it, as diagnostics: files that do not compile, a data source
        it does not configure.
      operationId: core.show
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: "Show the repo's datasets, or one dataset: their models, fields and metrics"
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /core.status:
    post:
      operationId: core.status
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
