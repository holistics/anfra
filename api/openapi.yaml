components:
  schemas:
    AQLDiagnostic:
      additionalProperties: false
      properties:
        column:
          format: int64
          type: integer
        line:
          format: int64
          type: integer
        message:
          type: string
        severity:
          type: string
      required:
        - message
        - severity
      type: object
    Column:
      additionalProperties: false
      properties:
        adhoc:
          description: a query-local expression, not a field the dataset defines
          type: boolean
        aggregation:
          description: an aggregated field's aggregation, such as sum or count distinct
          type: string
        arrow_type:
          additionalProperties: true
          description: the column's Arrow type, which says how its values are written. Absent before the query runs.
          properties:
            label:
              description: "the type as arrow-go spells it, such as decimal(38, 2): for people, not to decide on"
              type: string
            type:
              description: "the type's name, as Schema.fbs's Type union names it, in snake_case: int, floating_point, decimal, utf8, bool, date, timestamp, list, struct, ..."
              type: string
          required:
            - type
            - label
          type: object
        db_type:
          description: the database's own name for the column's type, for debugging only. Don't base decisions on it, because it varies by database and driver. Absent before the query runs.
          type: string
        fieldName:
          description: the field it draws, or for an adhoc column, its name
          type: string
        isMeasure:
          type: boolean
        label:
          type: string
        modelId:
          description: the model of fieldName, as the dataset names it. Absent for a dataset metric or an adhoc column.
          type: string
        name:
          description: the column's key, as in fields
          type: string
        semantic_type:
          description: the column's (database-agnostic) type in the semantic layer, such as number, date, or truefalse. Read the values by it. "bit" is a true or false stored as a bit, written as true and false or as "1" and "0", depending on how the database produced it. "unknown" is a type that has no meaning in AML, such as time or duration. Absent when no AQL typed the column, as for a SQL query or AQL that isn't an explore, so read arrow_type instead.
          enum:
            - bit
            - date
            - datetime
            - json
            - number
            - text
            - truefalse
            - unknown
          type: string
      required:
        - name
        - fieldName
        - label
        - adhoc
        - isMeasure
      type: object
    CompileError:
      additionalProperties: false
      properties:
        col:
          format: int64
          type: integer
        filePath:
          type: string
        message:
          type: string
        row:
          format: int64
          type: integer
      required:
        - message
      type: object
    CompiledQuery:
      additionalProperties: false
      properties:
        aql:
          description: the final AQL (with the Query Input applied). Absent for a SQL query.
          type: string
        columns:
          description: what each column of an explore query's result will be, with its semantic type. Absent for other queries.
          items:
            $ref: "#/components/schemas/Column"
          type: array
        input:
          $ref: "#/components/schemas/QueryInput"
          description: the query's input as it compiled, every default filled in, its seeds included. Send it back with the same query to compile it the same way again. Absent for a SQL query.
        sql:
          type: string
      required:
        - sql
      type: object
    ContextEntry:
      additionalProperties: false
      properties:
        params:
          additionalProperties: {}
          type: object
        step:
          type: string
        text:
          type: string
      required:
        - step
        - text
      type: object
    Diagram:
      additionalProperties: false
      properties:
        cards:
          description: every card, in layer order
          items:
            $ref: "#/components/schemas/DiagramCard"
          type: array
        layers:
          description: the cards in layers, upstream first
          items:
            $ref: "#/components/schemas/DiagramLayer"
          type: array
        matched:
          description: the ids of this page's matched entities, in search order
          items:
            type: string
          type: array
        query:
          description: the search query that finds the lineage
          type: string
        schema:
          $ref: "#/components/schemas/DiagramSchema"
        total:
          description: how many entities the search matched, over every page
          format: int64
          type: integer
        version:
          enum:
            - 2
          format: int64
          type: integer
      required:
        - version
        - query
        - total
        - matched
        - schema
        - layers
        - cards
      type: object
    DiagramCard:
      additionalProperties: false
      properties:
        detached:
          description: whether the card's entity is usually nested in another card, but its container isn't in the lineage
          type: boolean
        id:
          description: the catalog's id of the entity
          type: string
        label:
          type: string
        layer:
          format: int64
          type: integer
        links:
          description: the links that start at this node
          items:
            $ref: "#/components/schemas/DiagramLink"
          type: array
        props:
          additionalProperties: {}
          description: the entity's properties
          type: object
        ref:
          description: the id of the entity this node is a copy of, such as the model's field behind a dataset's field
          type: string
        sections:
          description: the node's children, grouped by type
          items:
            $ref: "#/components/schemas/DiagramSection"
          type: array
        tags:
          items:
            type: string
          type: array
        type:
          description: the catalog's entity type, such as aml.model or aml.metric
          type: string
      required:
        - layer
        - id
        - type
        - label
      type: object
    DiagramLayer:
      additionalProperties: false
      properties:
        card_ids:
          items:
            type: string
          type: array
        index:
          format: int64
          type: integer
        types:
          description: the entity types of its cards
          items:
            type: string
          type: array
      required:
        - index
        - types
        - card_ids
      type: object
    DiagramLink:
      additionalProperties: false
      properties:
        props:
          additionalProperties: {}
          description: the edge's properties, when it has some
          type: object
        to:
          description: the linked entity's id
          type: string
        type:
          description: the edge type, such as refers or includes
          type: string
      required:
        - type
        - to
      type: object
    DiagramNode:
      additionalProperties: false
      properties:
        id:
          description: the catalog's id of the entity
          type: string
        label:
          type: string
        links:
          description: the links that start at this node
          items:
            $ref: "#/components/schemas/DiagramLink"
          type: array
        props:
          additionalProperties: {}
          description: the entity's properties
          type: object
        ref:
          description: the id of the entity this node is a copy of, such as the model's field behind a dataset's field
          type: string
        sections:
          description: the node's children, grouped by type
          items:
            $ref: "#/components/schemas/DiagramSection"
          type: array
        tags:
          items:
            type: string
          type: array
        type:
          description: the catalog's entity type, such as aml.model or aml.metric
          type: string
      required:
        - id
        - type
        - label
      type: object
    DiagramSchema:
      additionalProperties: false
      properties:
        edges:
          additionalProperties:
            type: string
          description: edge type → what it means
          type: object
        types:
          additionalProperties:
            $ref: "#/components/schemas/DiagramSchemaType"
          description: entity type → how it connects
          type: object
      required:
        - edges
        - types
      type: object
    DiagramSchemaType:
      additionalProperties: false
      properties:
        edges:
          additionalProperties:
            items:
              type: string
            type: array
          description: edge type → the entity types it links to
          type: object
        top_level:
          description: no entity of the type is a child in a section
          type: boolean
      required:
        - top_level
        - edges
      type: object
    DiagramSection:
      additionalProperties: false
      properties:
        nodes:
          items:
            $ref: "#/components/schemas/DiagramNode"
          type: array
        type:
          type: string
      required:
        - type
        - nodes
      type: object
    ErrorBodyExportsUnavailable:
      additionalProperties: false
      description: This server cannot make exports.
      properties:
        code:
          const: exports_unavailable
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 501
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyInternalServerError:
      additionalProperties: false
      description: Something went wrong on our side.
      properties:
        code:
          const: internal_server_error
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 500
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyInvalidRequest:
      additionalProperties: false
      description: The request is not valid.
      properties:
        code:
          const: invalid_request
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/Violations"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: client
          type: string
        status:
          const: 400
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyPageTooLarge:
      additionalProperties: false
      description: The page is larger than this server may return at once.
      properties:
        code:
          const: page_too_large
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/PageLimit"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyQueryFailed:
      additionalProperties: false
      description: The query failed to run on its data source.
      properties:
        code:
          const: query_failed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyQueryInvalid:
      additionalProperties: false
      description: The query is invalid.
      properties:
        code:
          const: query_invalid
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/QueryValidation"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyResultTooLarge:
      additionalProperties: false
      description: The query's result is larger than this server allows.
      properties:
        code:
          const: result_too_large
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/ResultLimit"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodySidecarUnavailable:
      additionalProperties: false
      description: A sidecar (a process anfra runs to compile AML or run queries) is unavailable.
      properties:
        code:
          const: sidecar_unavailable
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 503
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyValidationFailed:
      additionalProperties: false
      description: Some of the input is not valid.
      properties:
        code:
          const: validation_failed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/Violations"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ExportFormatOptions:
      additionalProperties: false
      properties:
        bom:
          description: "csv: start the file with a UTF-8 byte-order mark, which Excel needs to read non-ASCII text; set it for a file a person will open"
          type: boolean
        header:
          description: "csv: the header row, the columns' labels by default. \"names\" writes their names instead, which stay stable for programs, and \"none\" leaves the header row out."
          enum:
            - labels
            - names
            - none
          type: string
      type: object
    ExportLink:
      additionalProperties: false
      properties:
        expires_at:
          description: when the link stops working
          format: date-time
          type: string
        filename:
          description: the file's name, as a download saves it
          type: string
        format:
          description: the file's format
          type: string
        row_count:
          description: how many rows the file holds
          format: int64
          type: integer
        url:
          description: "where to download the file: a plain GET, with no credentials, until expires_at"
          type: string
      required:
        - url
        - filename
        - format
        - row_count
        - expires_at
      type: object
    FieldLineage:
      additionalProperties: false
      properties:
        diagram:
          $ref: "#/components/schemas/Diagram"
          description: the field's lineage. Absent when error is set.
        error:
          description: why the field's lineage could not be traced
          type: string
        query:
          description: the search query that finds the field's lineage, which the search command also takes. Empty when the field could not be searched for.
          type: string
        target:
          $ref: "#/components/schemas/LineageTarget"
          description: the field, as asked
      required:
        - target
        - query
      type: object
    IngestInput:
      additionalProperties: false
      properties:
        source:
          description: the context source to ingest, every source by default
          type: string
      type: object
    LineageInput:
      additionalProperties: false
      properties:
        limit:
          description: the most upstream entities to return per field, all of them by default
          format: int64
          minimum: 1
          type: integer
        offset:
          description: skip this many upstream entities first, to page with limit
          format: int64
          minimum: 0
          type: integer
        targets:
          description: "the fields to trace, each by its parent and its name in it: {\"parent\": \"orders\", \"child\": \"amount\"}"
          items:
            $ref: "#/components/schemas/LineageTarget"
          type: array
      type: object
    LineageResult:
      additionalProperties: false
      properties:
        results:
          items:
            $ref: "#/components/schemas/FieldLineage"
          type: array
      required:
        - results
      type: object
    LineageTarget:
      additionalProperties: false
      properties:
        child:
          description: "the field's name in its parent: a dimension, a measure or a metric"
          minLength: 1
          type: string
        parent:
          description: "the fqn of what holds the field: a model, or a dataset"
          minLength: 1
          type: string
      required:
        - parent
        - child
      type: object
    NoInput:
      additionalProperties: false
      type: object
    PageLimit:
      additionalProperties: false
      properties:
        max_bytes:
          format: int64
          type: integer
      required:
        - max_bytes
      type: object
    Pagination:
      additionalProperties: false
      properties:
        page:
          description: the 1-based page of rows to return, 1 by default
          format: int64
          minimum: 1
          type: integer
        pageSize:
          description: how many rows a page has
          format: int64
          maximum: 10000
          minimum: 1
          type: integer
      required:
        - pageSize
      type: object
    QueryCompiled:
      additionalProperties: false
      properties:
        aql:
          description: the final AQL (with the Query Input applied). Absent for a SQL query.
          type: string
        input:
          $ref: "#/components/schemas/QueryInput"
          description: the query's input as it runs, every default filled in, its seeds included. Send it back with the same query to get the same answer again. Absent for a SQL query.
        sql:
          type: string
        type:
          enum:
            - compiled
          type: string
      required:
        - type
        - sql
      type: object
    QueryCondition:
      additionalProperties: false
      properties:
        expr:
          description: an AQL condition
          type: string
      required:
        - expr
      type: object
    QueryDateDrill:
      additionalProperties: false
      properties:
        field:
          description: "model.field: a date field"
          type: string
        grain:
          description: the grain, such as month
          type: string
      required:
        - field
        - grain
      type: object
    QueryDefinition:
      additionalProperties: false
      properties:
        data_source:
          description: the data source a SQL query runs against
          type: string
        dataset:
          description: the dataset an AQL query runs against
          type: string
        lang:
          default: aql
          description: the language the query is written in
          enum:
            - aql
            - sql
          type: string
        query:
          description: the query
          minLength: 1
          type: string
      required:
        - query
      type: object
    QueryExportRequestParams:
      additionalProperties: false
      properties:
        data_source:
          description: the data source a SQL query runs against
          type: string
        dataset:
          description: the dataset an AQL query runs against
          type: string
        filename:
          description: the file's name, as a download saves it, with the format's extension added when it has none; when unset or blank, the dataset's or data source's name
          type: string
        format:
          default: csv
          description: the file's format
          enum:
            - csv
          type: string
        format_options:
          $ref: "#/components/schemas/ExportFormatOptions"
          description: the format's options
        input:
          $ref: "#/components/schemas/QueryInput"
          description: "the query's input, for AQL only: the Query Input (filters, conditions, sorts and date drills applied to the AQL before it compiles), a page of rows, the time zone, and the seeds. With input.pagination, the file holds that page; without, every row."
        lang:
          default: aql
          description: the language the query is written in
          enum:
            - aql
            - sql
          type: string
        query:
          description: the query
          minLength: 1
          type: string
        timezone:
          deprecated: true
          description: "deprecated: use input.timezone. Ignored when input.timezone is set."
          type: string
      required:
        - query
      type: object
    QueryFilter:
      additionalProperties: false
      properties:
        aggregation:
          description: the aggregation to apply to the field before filtering, such as sum
          type: string
        field:
          description: model.field for a dataset field, or the name of a dataset metric
          type: string
        modifier:
          description: the date unit of a relative operator, such as day
          type: string
        operator:
          description: the operator, such as is, contains, between, last
          type: string
        values:
          description: the operator's values, empty for an operator that takes none. Write a number as a string, such as "9007199254740993", because a JSON number may have lost digits and is refused. Write a date or text as a string too, and a truefalse value as true or false.
          items: {}
          type: array
      required:
        - field
        - operator
        - values
      type: object
    QueryHeader:
      additionalProperties: false
      properties:
        columns:
          description: one per field, in order
          items:
            $ref: "#/components/schemas/Column"
          type: array
        fields:
          items:
            type: string
          type: array
        type:
          enum:
            - header
          type: string
      required:
        - type
        - columns
        - fields
      type: object
    QueryInput:
      additionalProperties: false
      properties:
        conditions:
          description: AQL conditions ANDed with the query's own filters
          items:
            $ref: "#/components/schemas/QueryCondition"
          type: array
        dateDrills:
          description: grain changes on date fields. The fields keep their column names.
          items:
            $ref: "#/components/schemas/QueryDateDrill"
          type: array
        filters:
          description: conditions on fields, ANDed with the query's own filters
          items:
            $ref: "#/components/schemas/QueryFilter"
          type: array
        pagination:
          $ref: "#/components/schemas/Pagination"
          description: "which rows to return: pageSize rows, from the 1-based page. Without it, every row."
        seeds:
          $ref: "#/components/schemas/Seeds"
          description: values the server generates for each request when they're unset. Generated seeds typically change with every request, and the response returns them. Set seeds to generate the same SQL again, for example to replay a query as of a given time.
        sorts:
          description: sorts by result column, replacing the query's own
          items:
            $ref: "#/components/schemas/QuerySort"
          type: array
        timezone:
          description: the IANA time zone that relative dates and date truncation use, such as Asia/Ho_Chi_Minh. UTC by default.
          type: string
      type: object
    QueryRecords:
      additionalProperties: false
      properties:
        records:
          description: one array per row, its values in fields' order, written as a page's records are
          items:
            items: {}
            type: array
          type: array
        type:
          enum:
            - rows
          type: string
      required:
        - type
        - records
      type: object
    QueryRequestParams:
      additionalProperties: false
      properties:
        data_source:
          description: the data source a SQL query runs against
          type: string
        dataset:
          description: the dataset an AQL query runs against
          type: string
        input:
          $ref: "#/components/schemas/QueryInput"
          description: "the query's input, for AQL only: the Query Input (filters, conditions, sorts and date drills applied to the AQL before it compiles), a page of rows, the time zone, and the seeds. The answer returns it as the query ran: send it back with the same query to get the same answer again."
        lang:
          default: aql
          description: the language the query is written in
          enum:
            - aql
            - sql
          type: string
        page:
          deprecated: true
          description: "deprecated: use input.pagination.page. Ignored when input.pagination is set."
          format: int64
          minimum: 1
          type: integer
        page_size:
          deprecated: true
          description: "deprecated: use input.pagination.pageSize. Ignored when input.pagination is set."
          format: int64
          maximum: 10000
          minimum: 1
          type: integer
        query:
          description: the query
          minLength: 1
          type: string
        timezone:
          deprecated: true
          description: "deprecated: use input.timezone. Ignored when input.timezone is set."
          type: string
      required:
        - query
      type: object
    QueryResult:
      additionalProperties: false
      properties:
        aql:
          description: the final AQL (with the Query Input applied). Absent for a SQL query.
          type: string
        columns:
          description: one per field of result, in order
          items:
            $ref: "#/components/schemas/Column"
          type: array
        has_more:
          description: whether there may be rows after this page. To get them, ask for the next page, or export the query.
          type: boolean
        input:
          $ref: "#/components/schemas/QueryInput"
          description: the query's input as it ran, every default filled in, its seeds included. Send it back with the same query to get the same answer again. Absent for a SQL query.
        result:
          $ref: "#/components/schemas/QueryRows"
        sql:
          type: string
        timings:
          $ref: "#/components/schemas/Timings"
          description: the query's steps, and when each started. The steps are compiling_query (for AQL only), connecting_to_dw, executing_query, fetching_query_result, and retrying_query, which is a wait before the query is tried again. connecting_to_dw, executing_query, and fetching_query_result may have child steps.
      required:
        - sql
        - columns
        - result
        - has_more
        - timings
      type: object
    QueryRows:
      additionalProperties: false
      properties:
        fields:
          items:
            type: string
          type: array
        records:
          description: one array per row, its values in fields' order. Read each value by its column's types. Every number is a string with all its digits, because a JSON number loses some in JavaScript. A float's NaN and infinities are "NaN", "Infinity", and "-Infinity". The same holds at any depth of a list, map, or struct. A database NULL is null.
          items:
            items: {}
            type: array
          type: array
      required:
        - fields
        - records
      type: object
    QuerySort:
      additionalProperties: false
      properties:
        direction:
          description: the direction
          enum:
            - asc
            - desc
          type: string
        field:
          description: a result column's name
          type: string
      required:
        - field
        - direction
      type: object
    QuerySummary:
      additionalProperties: false
      properties:
        bytes_scanned:
          description: the bytes the warehouse read to run the query, where it reports them (BigQuery, Athena)
          format: int64
          type: integer
        has_more:
          description: whether there may be rows after this page. Without input.pagination, every row was sent, and this is false.
          type: boolean
        row_count:
          format: int64
          type: integer
        timings:
          $ref: "#/components/schemas/Timings"
          description: the query's steps, and when each started. The steps are compiling_query (for AQL only), connecting_to_dw, executing_query, fetching_query_result, and retrying_query, which is a wait before the query is tried again. connecting_to_dw, executing_query, and fetching_query_result may have child steps.
        type:
          enum:
            - summary
          type: string
      required:
        - type
        - row_count
        - has_more
        - timings
      type: object
    QueryValidation:
      additionalProperties: false
      properties:
        diagnostics:
          items:
            $ref: "#/components/schemas/AQLDiagnostic"
          type: array
        valid:
          type: boolean
      required:
        - valid
        - diagnostics
      type: object
    QueryWarehouse:
      additionalProperties: false
      properties:
        id:
          description: the warehouse's own id of the query; for Postgres, the process id of the backend running it
          type: string
        type:
          enum:
            - warehouse_query
          type: string
      required:
        - type
        - id
      type: object
    RepoStatus:
      additionalProperties: false
      properties:
        id:
          description: "the repo's id, which names its state folder: <ANFRA_HOME>/repos/<id>"
          type: string
        logs:
          description: the repo's log file, which holds anfra's and its sidecars' logs. Absent for a managed repo.
          type: string
      required:
        - id
      type: object
    RepoValidation:
      additionalProperties: false
      properties:
        diagnostics:
          items:
            $ref: "#/components/schemas/CompileError"
          type: array
        reports:
          items:
            $ref: "#/components/schemas/ValidationReport"
          type: array
        valid:
          type: boolean
      required:
        - valid
        - diagnostics
        - reports
      type: object
    ReportTrace:
      additionalProperties: false
      properties:
        kind:
          type: string
        loc:
          $ref: "#/components/schemas/ReportTraceLoc"
        name:
          type: string
      required:
        - kind
        - name
      type: object
    ReportTraceLoc:
      additionalProperties: false
      properties:
        column:
          format: int64
          type: integer
        filePath:
          type: string
        line:
          format: int64
          type: integer
      required:
        - filePath
      type: object
    Response:
      additionalProperties: false
      properties:
        code:
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details: {}
        message:
          type: string
        request_id:
          type: string
        scope:
          type: string
        status:
          format: int64
          type: integer
      required:
        - code
        - scope
        - message
        - request_id
      type: object
    ResultLimit:
      additionalProperties: false
      properties:
        max_bytes:
          format: int64
          type: integer
        max_rows:
          format: int64
          type: integer
      type: object
    SearchInput:
      additionalProperties: false
      properties:
        limit:
          description: the most entities to return, 50 by default
          format: int64
          maximum: 100
          minimum: 1
          type: integer
        offset:
          description: skip this many entities first, to page with limit
          format: int64
          minimum: 0
          type: integer
        query:
          description: search query
          items:
            type: string
          type: array
      type: object
    Seeds:
      additionalProperties: false
      properties:
        referenceTime:
          description: the time the query runs as of. Relative dates, such as last 7 days, are counted from this time's day.
          format: date-time
          type: string
      type: object
    ServerStatus:
      additionalProperties: false
      properties:
        instance_id:
          type: string
        sidecars:
          $ref: "#/components/schemas/SidecarHealth"
        state:
          enum:
            - healthy
            - degraded
            - not_running
          type: string
        url:
          type: string
        version:
          type: string
      required:
        - state
      type: object
    ShowDataset:
      additionalProperties: false
      properties:
        description:
          type: string
        fqn:
          description: the dataset's fully qualified name, as AQL and the catalog name it
          type: string
        kind:
          enum:
            - dataset
          type: string
        label:
          type: string
        metrics:
          description: the dataset's metrics. Absent when the dataset is shown in outline.
          items:
            $ref: "#/components/schemas/ShowField"
          type: array
        models:
          description: the models the dataset uses. Absent when the dataset is shown in outline.
          items:
            $ref: "#/components/schemas/ShowModel"
          type: array
        name:
          type: string
      required:
        - kind
        - fqn
        - name
      type: object
    ShowField:
      additionalProperties: false
      properties:
        aggregation:
          description: a measure's aggregation, such as sum or count distinct; custom for a custom one
          type: string
        definedInDataset:
          description: a dimension the dataset declares on one of its models
          type: boolean
        definition:
          description: the definition of a field or metric written in AQL
          type: string
        description:
          type: string
        format:
          description: how a value displays, as the AML declares it
        fqn:
          description: "the catalog's identity: <model fqn>.<name>, or <dataset fqn>.<name> for a dataset-level field or a metric"
          type: string
        hidden:
          type: boolean
        label:
          type: string
        name:
          description: the field's or metric's name. AQL writes a field as <model fqn>.<name>, and a metric by its name alone.
          type: string
        role:
          enum:
            - dimension
            - measure
            - param
            - metric
          type: string
        type:
          description: the field's semantic type, such as number, text, date, datetime, or truefalse
          type: string
      required:
        - fqn
        - name
        - role
        - type
        - hidden
      type: object
    ShowInput:
      additionalProperties: false
      properties:
        fqn:
          description: the fqn of the dataset to show, the whole repo by default
          type: string
        type:
          default: aml.dataset
          description: the catalog's entity type of fqn
          enum:
            - aml.dataset
          type: string
      type: object
    ShowModel:
      additionalProperties: false
      properties:
        description:
          type: string
        fields:
          items:
            $ref: "#/components/schemas/ShowField"
          type: array
        fqn:
          description: "the model's fully qualified name: what AQL writes before a field"
          type: string
        label:
          type: string
        name:
          type: string
      required:
        - fqn
        - name
        - fields
      type: object
    ShowRepo:
      additionalProperties: false
      properties:
        datasets:
          description: the repo's datasets, each in full, or in outline (without its models and metrics) when the dataset can't be shown in full. A diagnostic then says why.
          items:
            $ref: "#/components/schemas/ShowDataset"
          type: array
        kind:
          enum:
            - repo
          type: string
      required:
        - kind
        - datasets
      type: object
    ShowResult:
      additionalProperties: false
      properties:
        diagnostics:
          description: the problems in the repo that affect what is shown, such as files that don't compile, a dataset's data source that isn't configured, or a dataset that can't be shown in full. Empty when what is shown is complete.
          items:
            $ref: "#/components/schemas/CompileError"
          type: array
        object:
          description: the object shown, by kind; a client must accept a kind it does not know
          discriminator:
            mapping:
              dataset: "#/components/schemas/ShowDataset"
              repo: "#/components/schemas/ShowRepo"
            propertyName: kind
          oneOf:
            - $ref: "#/components/schemas/ShowRepo"
            - $ref: "#/components/schemas/ShowDataset"
      required:
        - object
        - diagnostics
      type: object
    SidecarHealth:
      additionalProperties: false
      properties:
        canal-query:
          type: string
        node:
          type: string
      required:
        - node
        - canal-query
      type: object
    SkillsResult:
      additionalProperties: false
      properties:
        checked:
          type: string
        latest:
          type: string
        version:
          type: string
      type: object
    StatusResult:
      additionalProperties: false
      properties:
        hints:
          description: what to do next, if any
          items:
            type: string
          type: array
        repo:
          $ref: "#/components/schemas/RepoStatus"
        server:
          $ref: "#/components/schemas/ServerStatus"
      required:
        - repo
        - server
      type: object
    StreamEnd:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/Response"
        status:
          enum:
            - succeeded
            - failed
          type: string
        type:
          enum:
            - end
          type: string
      required:
        - type
        - status
      type: object
    StreamPing:
      additionalProperties: false
      properties:
        type:
          enum:
            - ping
          type: string
      required:
        - type
      type: object
    StreamStart:
      additionalProperties: false
      properties:
        id:
          description: the run's id, on a host that keeps a record of runs
          type: string
        type:
          enum:
            - start
          type: string
      required:
        - type
      type: object
    StreamStatus:
      additionalProperties: false
      properties:
        phase:
          type: string
        position:
          description: while the run is queued, how many runs are ahead of it. 0 means it is next. Absent for other phases, or when its place in line isn't known.
          format: int64
          type: integer
        type:
          enum:
            - status
          type: string
      required:
        - type
        - phase
      type: object
    TimedStep:
      additionalProperties: false
      properties:
        start_ms:
          description: when it started, in ms since the run started
          format: int64
          type: integer
        step:
          description: the step's name. A child step is named <parent>.<child>, and runs within its parent.
          type: string
      required:
        - step
        - start_ms
      type: object
    Timings:
      additionalProperties: false
      properties:
        end_ms:
          description: when the run ended, in ms since it started, which is its total time and when its last step ends
          format: int64
          type: integer
        steps:
          description: each step, in the order it started. A step that runs again appears again.
          items:
            $ref: "#/components/schemas/TimedStep"
          type: array
      required:
        - steps
        - end_ms
      type: object
    UpdateInfo:
      additionalProperties: false
      properties:
        available:
          type: boolean
        latest:
          type: string
      required:
        - latest
        - available
      type: object
    ValidateInput:
      additionalProperties: false
      properties:
        globs:
          description: globs of the files to report diagnostics for, every file by default
          items:
            type: string
          maxItems: 100
          type: array
      type: object
    ValidationReport:
      additionalProperties: false
      properties:
        code: {}
        filePath:
          type: string
        fqn:
          type: string
        message:
          type: string
        severity:
          type: string
        trace:
          items:
            $ref: "#/components/schemas/ReportTrace"
          type: array
        type:
          type: string
        validator:
          type: string
      required:
        - validator
        - filePath
        - type
        - fqn
        - severity
        - message
      type: object
    VersionInput:
      additionalProperties: false
      properties:
        skills:
          description: the version of the anfra skills in use, from the "anfra skills <version>" line that ends each skill, or "unknown" when a skill has none. With it, the result also says whether the skills are behind.
          type: string
      type: object
    VersionResult:
      additionalProperties: false
      properties:
        hints:
          items:
            type: string
          type: array
        skills:
          $ref: "#/components/schemas/SkillsResult"
        update:
          $ref: "#/components/schemas/UpdateInfo"
        version:
          type: string
      required:
        - version
      type: object
    Violation:
      additionalProperties: false
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
      required:
        - field
        - code
        - message
      type: object
    Violations:
      additionalProperties: false
      properties:
        violations:
          items:
            $ref: "#/components/schemas/Violation"
          type: array
      required:
        - violations
      type: object
info:
  title: anfra
  version: "0"
openapi: 3.1.0
paths:
  /core.ingest:
    post:
      operationId: core.ingest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Build the local search catalog from the repo's context sources
      x-destructive: true
      x-idempotent: true
      x-read-only: false
  /core.lineage:
    post:
      description: Trace each field through the local catalog to the fields, models, and sources it is built from. Return each field's lineage as a diagram to draw, with cards in layers from upstream to downstream, and the links between them.
      operationId: core.lineage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineageInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineageResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Trace fields through the local catalog to what each one is built from
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /core.query:
    post:
      description: |-
        Run a query, and return a page of its rows and the SQL that produced them.

        A page is input.pagination.pageSize rows, or the first 10000 without it, and has_more says whether there may be more. Rather than paging through many rows, ask the query for what you need: an aggregate, a filter, or a limit: directive. To get every row of a large result, export it.

        Over HTTP, a request that accepts application/x-ndjson gets the result as the query runs: its phase, its SQL, its columns, then its rows in batches. Without input.pagination, that's every row, up to the server's maximum.
      operationId: core.query
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequestParams"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
            application/x-ndjson:
              schema:
                discriminator:
                  mapping:
                    compiled: "#/components/schemas/QueryCompiled"
                    end: "#/components/schemas/StreamEnd"
                    header: "#/components/schemas/QueryHeader"
                    ping: "#/components/schemas/StreamPing"
                    rows: "#/components/schemas/QueryRecords"
                    start: "#/components/schemas/StreamStart"
                    status: "#/components/schemas/StreamStatus"
                    summary: "#/components/schemas/QuerySummary"
                    warehouse_query: "#/components/schemas/QueryWarehouse"
                  propertyName: type
                oneOf:
                  - $ref: "#/components/schemas/QueryCompiled"
                  - $ref: "#/components/schemas/QueryWarehouse"
                  - $ref: "#/components/schemas/QueryHeader"
                  - $ref: "#/components/schemas/QueryRecords"
                  - $ref: "#/components/schemas/QuerySummary"
                  - $ref: "#/components/schemas/StreamStart"
                  - $ref: "#/components/schemas/StreamStatus"
                  - $ref: "#/components/schemas/StreamEnd"
                  - $ref: "#/components/schemas/StreamPing"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    oneOf:
                      - $ref: "#/components/schemas/ErrorBodyValidationFailed"
                      - $ref: "#/components/schemas/ErrorBodyQueryInvalid"
                      - $ref: "#/components/schemas/ErrorBodyQueryFailed"
                      - $ref: "#/components/schemas/ErrorBodyResultTooLarge"
                      - $ref: "#/components/schemas/ErrorBodyPageTooLarge"
                required:
                  - error
                type: object
          description: validation_failed, query_invalid, query_failed, result_too_large, page_too_large
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Run a query, and return its rows and the SQL that produced them
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /core.query.compile:
    post:
      operationId: core.query.compile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequestParams"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompiledQuery"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    oneOf:
                      - $ref: "#/components/schemas/ErrorBodyValidationFailed"
                      - $ref: "#/components/schemas/ErrorBodyQueryInvalid"
                required:
                  - error
                type: object
          description: validation_failed, query_invalid
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Compile a query to SQL, without running it
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /core.query.export:
    post:
      description: Export a query's whole result as a file, and return a link to download it once the file is ready.
      operationId: core.query.export
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryExportRequestParams"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportLink"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    oneOf:
                      - $ref: "#/components/schemas/ErrorBodyValidationFailed"
                      - $ref: "#/components/schemas/ErrorBodyQueryInvalid"
                      - $ref: "#/components/schemas/ErrorBodyQueryFailed"
                required:
                  - error
                type: object
          description: validation_failed, query_invalid, query_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "501":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyExportsUnavailable"
                required:
                  - error
                type: object
          description: exports_unavailable
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Export a query's whole result as a file to download
      x-destructive: false
      x-idempotent: false
      x-read-only: false
  /core.query.validate:
    post:
      operationId: core.query.validate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryDefinition"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryValidation"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
        "503":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodySidecarUnavailable"
                required:
                  - error
                type: object
          description: sidecar_unavailable
      summary: Validate a query without running it, and return its diagnostics
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /core.search:
    post:
      operationId: core.search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
