components:
  schemas:
    ContextEntry:
      additionalProperties: false
      properties:
        params:
          additionalProperties: {}
          type: object
        step:
          type: string
        text:
          type: string
      required:
        - step
        - text
      type: object
    CreateBlobsIn:
      additionalProperties: false
      properties:
        blobs:
          description: File contents, base64. At most limits.upload_blobs, of at most limits.upload_bytes in all.
          items:
            contentEncoding: base64
            type: string
          type: array
      required:
        - blobs
      type: object
    CreateBlobsOut:
      additionalProperties: false
      properties:
        oids:
          items:
            type: string
          type: array
      required:
        - oids
      type: object
    ErrorBodyBlobsMissing:
      additionalProperties: false
      description: Some files' content has not been uploaded.
      properties:
        code:
          const: blobs_missing
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/MissingBlobs"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: client
          type: string
        status:
          const: 409
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyInternalServerError:
      additionalProperties: false
      description: Something went wrong on our side.
      properties:
        code:
          const: internal_server_error
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 500
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyInvalidRequest:
      additionalProperties: false
      description: The request is not valid.
      properties:
        code:
          const: invalid_request
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/Violations"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: client
          type: string
        status:
          const: 400
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyRepoInvalid:
      additionalProperties: false
      description: The repo has errors. Fix them, then publish again.
      properties:
        code:
          const: repo_invalid
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/RepoProblems"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyValidationFailed:
      additionalProperties: false
      description: Some of the input is not valid.
      properties:
        code:
          const: validation_failed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/Violations"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    File:
      additionalProperties: false
      properties:
        oid:
          description: Its content's git blob id, uploaded with repos.create_blobs.
          type: string
        path:
          description: Slash-separated, relative to the repo root.
          type: string
      required:
        - path
        - oid
      type: object
    Limits:
      additionalProperties: false
      properties:
        files:
          description: The most files one publish may have, and the most blob ids one repos.list_missing_blobs call may name.
          format: int64
          type: integer
        upload_blobs:
          description: The most blobs one repos.create_blobs call may carry.
          format: int64
          type: integer
        upload_bytes:
          description: "The most content bytes one repos.create_blobs call may carry, before base64: also the largest file."
          format: int64
          type: integer
      required:
        - files
        - upload_blobs
        - upload_bytes
      type: object
    ListMissingBlobsIn:
      additionalProperties: false
      properties:
        oids:
          description: "Git blob ids of the files to publish: sha1 of \"blob <size>\\0\" and the content. At most limits.files."
          items:
            type: string
          type: array
      required:
        - oids
      type: object
    ListMissingBlobsOut:
      additionalProperties: false
      properties:
        oids:
          description: The blob ids to upload with repos.create_blobs before publishing.
          items:
            type: string
          type: array
      required:
        - oids
      type: object
    MissingBlobs:
      additionalProperties: false
      properties:
        oids:
          description: The blob ids to upload with repos.create_blobs.
          items:
            type: string
          type: array
      required:
        - oids
      type: object
    Person:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          type: string
      required:
        - id
        - email
      type: object
    PublishIn:
      additionalProperties: false
      properties:
        files:
          description: "Every file of the repo, as it is to be published: a file not listed is deleted. At most limits.files."
          items:
            $ref: "#/components/schemas/File"
          type: array
        message:
          description: What the publish is, for the repo's history.
          type: string
      required:
        - files
      type: object
    PublishOut:
      additionalProperties: false
      properties:
        changed:
          description: "False when the files were already the published ones: nothing changed."
          type: boolean
        replaced:
          $ref: "#/components/schemas/Replaced"
          description: The published revision this publish replaced; absent when nothing changed.
        revision:
          description: The revision now published.
          type: string
      required:
        - revision
        - changed
      type: object
    PublishSettings:
      additionalProperties: false
      properties:
        limits:
          $ref: "#/components/schemas/Limits"
      required:
        - limits
      type: object
    Replaced:
      additionalProperties: false
      properties:
        published_at:
          format: date-time
          type: string
        published_by:
          $ref: "#/components/schemas/Person"
          description: Who published it; absent for the repo's starting files.
        revision:
          type: string
      required:
        - revision
        - published_at
      type: object
    RepoProblems:
      additionalProperties: false
      properties:
        validation:
          description: "The engine's validation of the files published, as core.validate answers: its diagnostics and reports."
      required:
        - validation
      type: object
    StatusOut:
      additionalProperties: false
      properties:
        publish:
          $ref: "#/components/schemas/PublishSettings"
        published_at:
          format: date-time
          type: string
        published_by:
          $ref: "#/components/schemas/Person"
          description: Who published it; absent for the repo's starting files, which the org's creation put there.
        revision:
          description: "The published revision. Opaque: show it, do not parse it."
          type: string
      required:
        - revision
        - published_at
        - publish
      type: object
    Violation:
      additionalProperties: false
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
      required:
        - field
        - code
        - message
      type: object
    Violations:
      additionalProperties: false
      properties:
        violations:
          items:
            $ref: "#/components/schemas/Violation"
          type: array
      required:
        - violations
      type: object
info:
  title: anfra remote server
  version: "0"
openapi: 3.1.0
paths:
  /repos.create_blobs:
    post:
      description: Upload what repos.list_missing_blobs listed, in calls within limits.upload_blobs and limits.upload_bytes. Uploading content the repo has is harmless.
      operationId: repos.create_blobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlobsIn"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBlobsOut"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
      servers:
        - url: /api/o/{org}
          variables:
            org:
              default: my-org
              description: "The org published to, by its slug: the end of its address, https://bi.example.com/o/<org>."
      summary: Upload file contents to the org's repo, for a publish to name by blob id.
      x-destructive: true
      x-idempotent: true
      x-read-only: false
  /repos.list_missing_blobs:
    post:
      description: Compute each file's git blob id locally and name them all; upload only what is listed, with repos.create_blobs. A repeat publish of a small edit uploads one blob.
      operationId: repos.list_missing_blobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListMissingBlobsIn"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMissingBlobsOut"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyValidationFailed"
                required:
                  - error
                type: object
          description: validation_failed
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
      servers:
        - url: /api/o/{org}
          variables:
            org:
              default: my-org
              description: "The org published to, by its slug: the end of its address, https://bi.example.com/o/<org>."
      summary: "Which of the given blob ids the org's repo does not have yet: the content to upload before publishing."
      x-destructive: false
      x-idempotent: true
      x-read-only: true
  /repos.publish:
    post:
      description: "List every file, as path and blob id: a file not listed is deleted. Upload the content first; blobs_missing names any that is not. Files that fail validation are refused with repo_invalid, carrying the engine's problems, and nothing is published. The last publish wins: the answer says what it replaced."
      operationId: repos.publish
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishIn"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishOut"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "409":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyBlobsMissing"
                required:
                  - error
                type: object
          description: blobs_missing
        "422":
          content:
            application/json:
              schema:
                properties:
                  error:
                    oneOf:
                      - $ref: "#/components/schemas/ErrorBodyValidationFailed"
                      - $ref: "#/components/schemas/ErrorBodyRepoInvalid"
                required:
                  - error
                type: object
          description: validation_failed, repo_invalid
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
      servers:
        - url: /api/o/{org}
          variables:
            org:
              default: my-org
              description: "The org published to, by its slug: the end of its address, https://bi.example.com/o/<org>."
      summary: Publish files as the whole of the org's repo, once they pass validation.
      x-destructive: true
      x-idempotent: true
      x-read-only: false
  /repos.status:
    post:
      description: Read before publishing, to show what a publish will replace, and to batch uploads within the limits.
      operationId: repos.status
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOut"
          description: OK
        "400":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInvalidRequest"
                required:
                  - error
                type: object
          description: invalid_request
        "500":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: "#/components/schemas/ErrorBodyInternalServerError"
                required:
                  - error
                type: object
          description: internal_server_error
      servers:
        - url: /api/o/{org}
          variables:
            org:
              default: my-org
              description: "The org published to, by its slug: the end of its address, https://bi.example.com/o/<org>."
      summary: The published revision of the org's repo, who published it and when, and the limits for publishing.
      x-destructive: false
      x-idempotent: true
      x-read-only: true
servers:
  - url: /api
