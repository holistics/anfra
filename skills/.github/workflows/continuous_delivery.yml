name: Continuous Delivery

on:
  push:
    branches: [main]

concurrency:
  group: continuous_delivery

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  # Tags each plugin and the marketplace at their current versions.
  # Idempotent: versions that are already tagged are skipped, so this runs on every push.
  tag:
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/tag-release.sh
