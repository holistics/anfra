# Release manifest for the anfra single binary — the single source of truth for a
# release. To cut a release: bump `version` (and pin the sidecar release tags this
# version embeds), merge to main. anfra_tag.yml then pushes `v<version>`,
# which triggers build_release.yml to download the pinned sidecars, cross-build,
# and publish. Always bump `version` when changing a pin — otherwise the tag
# already exists and no new release is cut.
version: 0.21.0
sidecars:
  anfra_node: anfra-node-v0.14.0 # holistics/holistics-core release tag (anfra_node_build_binaries.yml)
  canal_query: query-v2.24.0 # holistics/canal release tag (build_and_release_binaries.yml)
# The cloud servers a release's bare `anfra auth login` offers, in this order, and whom it
# tells their users to email for another region. A server's id is a stable key, lowercase;
# leave out its url while it isn't available, and login shows it as upcoming. See
# DEVELOPMENT.md (Cloud login URL). Changing these alone cuts no release.
cloud_servers:
  - id: us
    label: United States
    url: https://us.anfra.ai
  - id: eu
    label: Europe
  - id: ap
    label: Asia Pacific
  - id: me
    label: Middle East
cloud_support_email: support@holistics.io
