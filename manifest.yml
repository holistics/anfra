# Release manifest for the anfra single binary — the single source of truth for a
# release. To cut a release: bump `version` (and pin the sidecar release tags this
# version embeds), merge to main. anfra_tag.yml then pushes `v<version>`,
# which triggers build_release.yml to download the pinned sidecars, cross-build,
# and publish. Always bump `version` when changing a pin — otherwise the tag
# already exists and no new release is cut.
version: 0.19.0
sidecars:
  anfra_node: anfra-node-v0.13.0 # holistics/holistics-core release tag (anfra_node_build_binaries.yml)
  # The binary anfra runs canal-query from (anfra-canal query), and canal-lake once anfra uses it.
  anfra_canal: anfra-canal-v1.0.0 # holistics/canal release tag (build_and_release_binaries.yml)
  # The services anfra_canal runs, as the releases it contains, for deployments that
  # run each as a service of its own (anfra-cloud's scripts/bump-anfra.sh).
  # scripts/sidecars.sh check holds them to what the binary reports.
  anfra_canal_services:
    canal_query: query-v2.25.0
    canal_lake: lake-v2.9.0
