# Release manifest for the anfra single binary — the single source of truth for a
# release. Each release starts as a release candidate (rc), which an rc PR cuts by
# setting `version` to it, such as 0.23.0-rc.1 (and pinning the sidecar release tags
# it embeds). Merged to main, tag_and_release.yml pushes `v<version>`, which triggers
# build_release.yml to download the pinned sidecars, cross-build, and publish. The
# release PR then sets `version` to the release, 0.23.0, and `promoted_from` to the rc
# it releases: tag_and_release.yml tags that rc's commit as the release. The next rc
# PR removes `promoted_from`. See docs/designs/release.md.
#
# Always cut an rc when changing a pin — otherwise no new release is made.
version: 0.24.0-rc.1
sidecars:
  anfra_node: anfra-node-v0.16.0 # holistics/holistics-core release tag (anfra_node_build_binaries.yml)
  anfra_canal: anfra-canal-v1.1.1 # holistics/canal release tag (build_and_release_binaries.yml)
  # The services anfra_canal runs, as the releases it contains, for deployments that run each as
  # a service of its own (anfra-cloud's scripts/bump-anfra.sh). scripts/sidecars.sh check holds
  # them to what the binary reports.
  anfra_canal_services:
    canal_query: query-v2.26.1
    canal_lake: lake-v2.10.0
# The cloud servers a release's bare `anfra auth login` offers, in this order, and whom it
# tells their users to email for another region. A server's id is a stable key, lowercase;
# leave out its url while it isn't available, and login shows it as upcoming. See
# DEVELOPMENT.md (Cloud login URL). Changing these alone cuts no release.
cloud_servers:
  - id: us
    label: United States
    url: https://us.anfra.ai
  - id: eu
    label: Europe
  - id: ap
    label: Asia Pacific
  - id: me
    label: Middle East
cloud_support_email: support@holistics.io
