# The warehouse of docker-compose.dev.yml (dev/seed.sql), from the host.
data_sources:
  demo:
    type: postgresql
    connection:
      host: localhost
      port: 5433
      user: anfra
      password: anfra
      dbname: anfra
  # Nothing listens on port 1: a data source the engine cannot reach.
  unreachable:
    type: postgresql
    connection:
      host: localhost
      port: 1
      user: anfra
      password: anfra
      dbname: anfra
