        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyExportsUnavailable:
      additionalProperties: false
      description: This server cannot make exports.
      properties:
        code:
          const: exports_unavailable
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 501
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyForbidden:
      additionalProperties: false
