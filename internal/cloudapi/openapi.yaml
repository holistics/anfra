          $ref: "#/components/schemas/RetryAfter"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: client
          type: string
        status:
          const: 429
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyRegistrationClosed:
      additionalProperties: false
      description: There is no account for this email, and this installation does not take sign-ups. Ask an Admin of your organization to invite you.
      properties:
        code:
          const: registration_closed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 403
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyRepoInvalid:
      additionalProperties: false
