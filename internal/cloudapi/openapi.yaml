          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyQueryInvalid:
      additionalProperties: false
      description: The query is invalid.
