          $ref: "#/components/schemas/RepoProblems"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyResultTooLarge:
      additionalProperties: false
      description: The query's result is larger than this server allows.
      properties:
        code:
          const: result_too_large
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/ResultLimit"
        message:
