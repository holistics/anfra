        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyRateLimited:
      additionalProperties: false
      description: Too many requests. Try again shortly.
      properties:
