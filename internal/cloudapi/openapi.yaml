      properties:
        code:
          const: blobs_missing
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/MissingBlobs"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: client
          type: string
        status:
          const: 409
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyCodeExpired:
      additionalProperties: false
      description: This code has expired. Send a new one.
      properties:
        code:
          const: code_expired
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 410
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyEmailUnverified:
      additionalProperties: false
      description: Verify your email address to accept this invitation.
      properties:
        code:
          const: email_unverified
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 403
          type: integer
      required:
