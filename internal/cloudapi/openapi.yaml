components:
  schemas:
    AQLDiagnostic:
      additionalProperties: false
      properties:
        column:
          format: int64
          type: integer
        line:
          format: int64
          type: integer
        message:
          type: string
        severity:
          type: string
      required:
        - message
        - severity
      type: object
    AcceptIn:
      additionalProperties: false
      properties:
        email:
          description: "Signed out only: the new account's address."
          type: string
        password:
          description: "Signed out only: the new account's password."
          type: string
        token:
          description: "The invitation token: the part of the link after '#'."
          type: string
      required:
        - token
      type: object
    AcceptOut:
      additionalProperties: false
      properties:
        org:
          $ref: "#/components/schemas/OrgView"
        verify_email:
          description: "The new account is signed in but has not joined: verify its address with an email code, then accept again."
          type: boolean
      required:
        - verify_email
      type: object
    CancelOut:
      additionalProperties: false
      properties:
        job_id:
          type: string
        outcome:
          type: string
      required:
        - job_id
        - outcome
      type: object
    CancelledBy:
      additionalProperties: false
      properties:
        cancelled_by:
          $ref: "#/components/schemas/Canceller"
      required:
        - cancelled_by
      type: object
    Canceller:
      additionalProperties: false
      properties:
        level:
          description: "the level they acted at: the platform (its admins), or the org"
          enum:
            - platform
            - org
          type: string
        user:
          $ref: "#/components/schemas/CancellingUser"
          description: "at the org level: as which of its users, by role"
      required:
        - level
      type: object
    CancellingUser:
      additionalProperties: false
      properties:
        role:
          description: "their role in the org when they stopped it: admin, analyst or explorer"
          type: string
        self:
          description: whether they are the job's own user, who stopped it from elsewhere
          type: boolean
      required:
        - role
        - self
      type: object
    ChangePasswordIn:
      additionalProperties: false
      properties:
        current_password:
          description: The password the account has now.
          type: string
        new_password:
          description: The password to replace it with.
          type: string
      required:
        - current_password
        - new_password
      type: object
    CodeVerified:
      additionalProperties: false
      properties:
        created:
          description: Whether this sign-in created the account.
          type: boolean
        user:
          $ref: "#/components/schemas/UserView"
      required:
        - user
        - created
      type: object
    Column:
      additionalProperties: false
      properties:
        adhoc:
          description: a query-local expression, not a field the dataset defines
          type: boolean
        aggregation:
          description: an aggregated field's aggregation, such as sum or count distinct
          type: string
        arrow_type:
          additionalProperties: true
          description: the Arrow type canal-query read the values as, by which they are written; absent before the query runs
          properties:
            label:
              description: "the type as arrow-go spells it, such as decimal(38, 2): for people, not to decide on"
              type: string
            type:
              description: "the type's name, as Schema.fbs's Type union names it, in snake_case: int, floating_point, decimal, utf8, bool, date, timestamp, list, struct, ..."
              type: string
          required:
            - type
            - label
          type: object
        db_type:
          description: "the database's own name of the column's type: for debugging, never to decide on, since it varies by database and driver; absent before the query runs"
          type: string
        fieldName:
          description: the field it draws; for an adhoc column, its name
          type: string
        isMeasure:
          type: boolean
        label:
          type: string
        modelId:
          description: the model of fieldName, as the dataset names it; absent for a dataset metric or an adhoc column
          type: string
        name:
          description: the column's key, as in fields
          type: string
        semantic_type:
          description: "what the column's values mean, in AML's types, plus bit: a true or false stored as a bit, written as true and false or as \"1\" and \"0\" by how the database produced it. Decide by it. Absent when no AQL types the column (a SQL query, or AQL that is not an explore): see arrow_type. Unknown when its AQL type has no meaning in AML (time, duration, ...)"
          enum:
            - bit
            - date
            - datetime
            - json
            - number
            - text
            - truefalse
            - unknown
          type: string
      required:
        - name
        - fieldName
        - label
        - adhoc
        - isMeasure
      type: object
    CompileError:
      additionalProperties: false
      properties:
        col:
          format: int64
          type: integer
        filePath:
          type: string
        message:
          type: string
        row:
          format: int64
          type: integer
      required:
        - message
      type: object
    CompiledQuery:
      additionalProperties: false
      properties:
        aql:
          description: "the AQL compiled: the query with its Query Input applied; absent for a SQL query"
          type: string
        columns:
          description: what each column of an explore query's answer will be, and its semantic type; absent for other queries
          items:
            $ref: "#/components/schemas/Column"
          type: array
        sql:
          type: string
      required:
        - sql
      type: object
    ContextEntry:
      additionalProperties: false
      properties:
        params:
          additionalProperties: {}
          type: object
        step:
          type: string
        text:
          type: string
      required:
        - step
        - text
      type: object
    CreateBlobsIn:
      additionalProperties: false
      properties:
        blobs:
          description: File contents, base64. At most limits.upload_blobs, of at most limits.upload_bytes in all.
          items:
            contentEncoding: base64
            type: string
          type: array
      required:
        - blobs
      type: object
    CreateBlobsOut:
      additionalProperties: false
      properties:
        oids:
          items:
            type: string
          type: array
      required:
        - oids
      type: object
    CreateDataSourceIn:
      additionalProperties: false
      properties:
        connection:
          additionalProperties: {}
          description: "The database driver's settings (host, user, password and so on), passed to it unchanged. Write-only: no response ever includes it."
          type: object
        name:
          description: "What AML's data_source_name refers to: a letter, then letters, digits and underscores, at most 63."
          type: string
        settings:
          additionalProperties: {}
          description: "The query engine's settings: timeouts, requiring SSL and the like, as data_sources.types lists them for the type. Each optional; a key the type does not list is refused. Absent: none, the engine's defaults."
          type: object
        type:
          description: "The database type: postgresql, bigquery, snowflake."
          type: string
      required:
        - name
        - type
        - connection
      type: object
    CreateOrgIn:
      additionalProperties: false
      properties:
        name:
          description: Its display name; the slug when empty.
          type: string
        slug:
          description: "The organization's address in URLs: lowercase letters, digits and hyphens."
          type: string
      required:
        - slug
      type: object
    CreatedOrg:
      additionalProperties: false
      properties:
        next:
          description: "The path to open now: the organization's home, or its onboarding."
          type: string
        org:
          $ref: "#/components/schemas/OrgView"
      required:
        - org
        - next
      type: object
    CredentialsIn:
      additionalProperties: false
      properties:
        email:
          description: The account's email address.
          type: string
        password:
          description: The account's password.
          type: string
      required:
        - email
        - password
      type: object
    DataSourceView:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        name:
          description: What AML's data_source_name refers to.
          type: string
        type:
          description: "The database type, which is also the SQL dialect: postgresql, bigquery, snowflake."
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - name
        - type
        - created_at
        - updated_at
      type: object
    DetailsRef:
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          type: string
      required:
        - type
        - id
      type: object
    Diagram:
      additionalProperties: false
      properties:
        cards:
          description: every card, in layer order
          items:
            $ref: "#/components/schemas/DiagramCard"
          type: array
        layers:
          description: the cards in layers, upstream first
          items:
            $ref: "#/components/schemas/DiagramLayer"
          type: array
        matched:
          description: the ids of this page's matched entities, in search order
          items:
            type: string
          type: array
        query:
          description: the catalog search the lineage is
          type: string
        schema:
          $ref: "#/components/schemas/DiagramSchema"
        total:
          description: how many entities the search matched, over every page
          format: int64
          type: integer
        version:
          enum:
            - 2
          format: int64
          type: integer
      required:
        - version
        - query
        - total
        - matched
        - schema
        - layers
        - cards
      type: object
    DiagramCard:
      additionalProperties: false
      properties:
        detached:
          description: its type is not a top-level one, but its container is not in the lineage
          type: boolean
        id:
          description: the catalog's id of the entity
          type: string
        label:
          type: string
        layer:
          format: int64
          type: integer
        links:
          description: the node's links; a link is on its edge's from entity
          items:
            $ref: "#/components/schemas/DiagramLink"
          type: array
        props:
          additionalProperties: {}
          description: the entity's properties
          type: object
        ref:
          description: the entity this node is a copy of
          type: string
        sections:
          description: the node's children, grouped by type
          items:
            $ref: "#/components/schemas/DiagramSection"
          type: array
        tags:
          items:
            type: string
          type: array
        type:
          description: the catalog's entity type, such as aml.model or aml.metric
          type: string
      required:
        - layer
        - id
        - type
        - label
      type: object
    DiagramLayer:
      additionalProperties: false
      properties:
        card_ids:
          items:
            type: string
          type: array
        index:
          format: int64
          type: integer
        types:
          description: the entity types of its cards
          items:
            type: string
          type: array
      required:
        - index
        - types
        - card_ids
      type: object
    DiagramLink:
      additionalProperties: false
      properties:
        props:
          additionalProperties: {}
          description: the edge's properties, when it has some
          type: object
        to:
          description: the linked entity's id
          type: string
        type:
          description: the edge type, such as refers or includes
          type: string
      required:
        - type
        - to
      type: object
    DiagramNode:
      additionalProperties: false
      properties:
        id:
          description: the catalog's id of the entity
          type: string
        label:
          type: string
        links:
          description: the node's links; a link is on its edge's from entity
          items:
            $ref: "#/components/schemas/DiagramLink"
          type: array
        props:
          additionalProperties: {}
          description: the entity's properties
          type: object
        ref:
          description: the entity this node is a copy of
          type: string
        sections:
          description: the node's children, grouped by type
          items:
            $ref: "#/components/schemas/DiagramSection"
          type: array
        tags:
          items:
            type: string
          type: array
        type:
          description: the catalog's entity type, such as aml.model or aml.metric
          type: string
      required:
        - id
        - type
        - label
      type: object
    DiagramSchema:
      additionalProperties: false
      properties:
        edges:
          additionalProperties:
            type: string
          description: edge type → what it means
          type: object
        types:
          additionalProperties:
            $ref: "#/components/schemas/DiagramSchemaType"
          description: entity type → how it connects
          type: object
      required:
        - edges
        - types
      type: object
    DiagramSchemaType:
      additionalProperties: false
      properties:
        edges:
          additionalProperties:
            items:
              type: string
            type: array
          description: edge type → the entity types it links to
          type: object
        top_level:
          description: no entity of the type is a child in a section
          type: boolean
      required:
        - top_level
        - edges
      type: object
    DiagramSection:
      additionalProperties: false
      properties:
        nodes:
          items:
            $ref: "#/components/schemas/DiagramNode"
          type: array
        type:
          type: string
      required:
        - type
        - nodes
      type: object
    Entry:
      additionalProperties: false
      properties:
        description:
          type: string
        scope:
          type: string
      required:
        - scope
        - description
      type: object
    ErrorBodyAccountExists:
      additionalProperties: false
      description: An account already exists for this email. Sign in to continue.
      properties:
        code:
          const: account_exists
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 409
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyAccountNotLinked:
      additionalProperties: false
      description: An account with this email already exists. Sign in the way you did before, then add this sign-in method from your account.
      properties:
        code:
          const: account_not_linked
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 409
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyApiVersionMismatch:
      additionalProperties: false
      description: This app is out of date. Reload to continue.
      properties:
        code:
          const: api_version_mismatch
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: client
          type: string
        status:
          const: 412
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyBlobsMissing:
      additionalProperties: false
      description: Some files' content has not been uploaded.
      properties:
        code:
          const: blobs_missing
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/MissingBlobs"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: client
          type: string
        status:
          const: 409
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyCancelled:
      additionalProperties: false
      description: This was stopped.
      properties:
        code:
          const: cancelled
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/CancelledBy"
        message:
          type: string
        request_id:
          type: string
        scope:
