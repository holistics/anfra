        - status
        - message
        - request_id
      type: object
    ErrorBodyInvalidRequest:
      additionalProperties: false
      description: The request is not valid.
      properties:
        code:
          const: invalid_request
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/Violations"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: client
          type: string
        status:
          const: 400
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyInvitationEmailMismatch:
      additionalProperties: false
      description: This invitation is for another email address. Sign in with that address to accept it.
      properties:
        code:
          const: invitation_email_mismatch
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 409
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyNotFound:
      additionalProperties: false
      description: Not found.
      properties:
        code:
          const: not_found
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 404
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyQueryFailed:
      additionalProperties: false
      description: The query failed to run on its data source.
      properties:
        code:
          const: query_failed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 502
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyQueryInvalid:
      additionalProperties: false
      description: The query is invalid.
      properties:
        code:
          const: query_invalid
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/QueryValidation"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyRateLimited:
      additionalProperties: false
      description: Too many requests. Try again shortly.
      properties:
        code:
          const: rate_limited
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/RetryAfter"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: client
          type: string
        status:
          const: 429
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyRegistrationClosed:
      additionalProperties: false
      description: There is no account for this email, and this installation does not take sign-ups. Ask an Admin of your organization to invite you.
      properties:
        code:
          const: registration_closed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 403
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyRepoInvalid:
      additionalProperties: false
      description: The repo has errors. Fix them, then publish again.
      properties:
        code:
          const: repo_invalid
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/RepoProblems"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodySidecarUnavailable:
      additionalProperties: false
      description: A sidecar is unavailable.
      properties:
        code:
          const: sidecar_unavailable
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 503
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyUnauthenticated:
      additionalProperties: false
      description: Sign in to continue.
      properties:
        code:
          const: unauthenticated
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 401
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyUnavailable:
      additionalProperties: false
      description: The service is temporarily unavailable. Try again shortly.
      properties:
        code:
          const: unavailable
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/RetryAfter"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 503
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ErrorBodyValidationFailed:
      additionalProperties: false
      description: Some of the input is not valid.
      properties:
        code:
          const: validation_failed
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        details:
          $ref: "#/components/schemas/Violations"
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 422
          type: integer
      required:
        - code
        - scope
        - status
        - message
        - request_id
      type: object
    ExportFormatOptions:
      additionalProperties: false
      properties:
        bom:
          description: "csv: start the file with a UTF-8 byte-order mark, which Excel needs to read non-ASCII text; set it for a file a person will open"
          type: boolean
        header:
          description: "csv: the header row: the columns' labels (the default; what readers see), their names (their keys in a query's answer, stable for programs), or none"
          enum:
            - labels
            - names
            - none
          type: string
      type: object
    ExportInput:
      additionalProperties: false
      properties:
        data_source:
          description: the data source a SQL query runs against
          type: string
        dataset:
          description: the dataset an AQL query runs against
          type: string
        filename:
          description: the file's name, as a download saves it, with the format's extension added when it has none; when unset or blank, the dataset's or data source's name
          type: string
        format:
          default: csv
          description: the file's format
          enum:
            - csv
          type: string
        format_options:
          $ref: "#/components/schemas/ExportFormatOptions"
          description: the format's options
        input:
          $ref: "#/components/schemas/QueryTransforms"
          description: "the Query Input: filters, conditions, sorts and date drills applied to the AQL before it compiles"
        lang:
          default: aql
          description: the language the query is written in
          enum:
            - aql
            - sql
          type: string
        query:
          description: the query
          minLength: 1
          type: string
        timezone:
          description: the IANA time zone relative dates and date truncation use, such as Asia/Ho_Chi_Minh
          type: string
      required:
        - query
      type: object
    ExportLink:
      additionalProperties: false
      properties:
        expires_at:
          description: when the link stops working
          format: date-time
          type: string
        filename:
          description: the file's name, as a download saves it
          type: string
        format:
          description: the file's format
          type: string
        row_count:
          description: the rows the file holds
          format: int64
          type: integer
        url:
          description: "where to download the file: a plain GET, with no credentials, until expires_at"
          type: string
      required:
        - url
        - filename
        - format
        - row_count
        - expires_at
      type: object
    Field:
      additionalProperties: false
      properties:
        keeps_secrets:
          description: Changing it keeps the saved secrets; changing any other field needs them given again.
          type: boolean
        key:
          description: The key in the connection, exactly as the driver reads it.
          type: string
        kind:
          description: text, number, or multiline (PEM or JSON text).
          type: string
        label:
          type: string
        placeholder:
          description: An example value, or the default when left out.
          type: string
        required:
          type: boolean
        secret:
          description: Never returned once saved.
          type: boolean
      required:
        - key
        - label
        - kind
      type: object
    GetDataSourceOut:
      additionalProperties: false
      properties:
        connection:
          additionalProperties: {}
          description: "The connection's fields that are not secret, as its type's fields in data_sources.types list them: never a password, key or token, nor a key the type does not list."
          type: object
        created_at:
          format: date-time
          type: string
        name:
          description: What AML's data_source_name refers to.
          type: string
        secrets:
          description: "The keys of the secret fields the connection holds a value for, never their values: a form shows them as saved."
          items:
            type: string
          type: array
        settings:
          additionalProperties: {}
          description: "Its settings for the query engine, as data_sources.create or .update gave them: none of them is secret. Empty for the engine's defaults."
          type: object
        type:
          description: "The database type, which is also the SQL dialect: postgresql, bigquery, snowflake."
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - connection
        - secrets
        - settings
        - name
        - type
        - created_at
        - updated_at
      type: object
    IdentitiesOut:
      additionalProperties: false
      properties:
        email_code:
          description: Whether a code sent to the account's address signs in to it.
          type: boolean
        identities:
          items:
            $ref: "#/components/schemas/IdentityView"
          type: array
      required:
        - identities
        - email_code
      type: object
    IdentityIn:
      additionalProperties: false
      properties:
        id:
          type: string
      required:
        - id
      type: object
    IdentityView:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          description: The provider's address when it was linked.
          type: string
        enabled:
          description: Whether this installation still offers the method; a disabled one signs nobody in.
          type: boolean
        id:
          type: string
        method:
          enum:
            - password
            - google
            - github
          type: string
      required:
        - id
        - method
        - enabled
        - created_at
      type: object
    IngestInput:
      additionalProperties: false
      properties:
        source:
          description: optional context source key to ingest
          type: string
      type: object
    InvitationIn:
      additionalProperties: false
      properties:
        id:
          type: string
      required:
        - id
      type: object
    InvitationView:
      additionalProperties: false
      properties:
        email:
          type: string
        expires_at:
          format: date-time
          type: string
        id:
