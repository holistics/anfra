      properties:
        code:
          const: internal_server_error
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: server
          type: string
        status:
          const: 500
          type: integer
      required:
