        code:
          const: email_unverified
          type: string
        context:
          items:
            $ref: "#/components/schemas/ContextEntry"
          type: array
        message:
          type: string
        request_id:
          type: string
        scope:
          const: user
          type: string
        status:
          const: 403
          type: integer
      required:
