version: "2"
run:
  modules-download-mode: readonly

# https://golangci-lint.run/usage/linters
linters:
  enable:
    - contextcheck
    - depguard
    - dupl
    - gocritic
    - gosec
    - misspell
    - reassign
    - spancheck
    - unconvert
    - wastedassign
  settings:
    depguard:
      rules:
        # Tenant and user identity is tracing baggage: it names who an
        # invocation is for, and it must never become an input to what a query
        # returns. The compile path is where row predicates are injected, so
        # these are the packages where reading an identity would silently turn
        # it into an access decision. internal/dataperm carries what MAY affect
        # a result; internal/attribution carries what may not.
        attribution-is-not-a-decision:
          files:
            - "**/internal/query/**"
            - "**/internal/sidecar/**"
            - "**/internal/datasource/**"
          deny:
            - pkg: github.com/holistics/anfra/internal/attribution
              desc: >-
                internal/attribution is for logs and audit only. If a value must
                change which rows a query returns, it belongs in
                internal/dataperm.Attributes, passed explicitly by the host.
    spancheck:
      # apptracing.Start starts a span its caller must End: every caller is held
      # to it, as with OpenTelemetry's own Start.
      extra-start-span-signatures:
        - "github.com/holistics/anfra/shared/apptracing.Start:opentelemetry"
    gosec:
      excludes:
        - G115 # https://github.com/securego/gosec/issues/1212
    staticcheck:
      checks:
        - all
        - "-QF1008" # omitting embedded field from selector
        - "-QF1011" # redundant type declaration
        - "-SA9003" # empty branch - can be useful for readability/commenting purposes
        - "-ST1003" # follow common variables (e.g. URL instead of Url)
        - "-ST1005" # error punctuation
        - "-ST1012" # error variable name
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gocritic
        path: cmd\/.*\/main\.go$
        # it's our intention to exit immediately with error code
        text: exitAfterDefer
      - path: '(.+)_test\.go'
        linters:
          - dupl
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
