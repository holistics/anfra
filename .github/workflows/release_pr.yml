# Open the rc PR, which cuts anfra's next release candidate (rc): `pnpm bump <rc>` on a fresh
# branch from main, committed as `release: <rc>`. Merging it tags the rc, which build_release.yml
# publishes as a prerelease; the rc's build then opens the release PR, which releases it once
# anfra Cloud runs it (docs/designs/release.md).
#
# Daily (Monday to Saturday), onto one branch, release/rc: each run rebuilds it from main and
# force-pushes it, and closes its one pull request and opens a new one (an edit notifies no one),
# so there is never more than one open, and it is never more than a day behind main. A run that
# finds release/rc holding this rc of the current main already changes nothing. When main has
# nothing releasable since the last release (scripts/next-version.mjs), it closes that pull
# request instead.
#
# While an rc waits for its release, a daily run cuts no rc: it comments on the release PR, when
# main has changes since the rc, and fails when no release PR is open.
# scripts/release-pr.sh does all of it, and runs locally with --dry-run.
#
# By hand (workflow_dispatch): it cuts the next rc, even while one waits, of the same release or a
# later one. `version` names the rc instead of computing it; `branch` names a new branch to put it
# on instead of release/rc, for an rc that needs commits of its own (sidecar pins, say): push them
# onto that branch. That branch must not exist yet, so a run never overwrites anyone's commits;
# release/rc is the bot's own and gets overwritten every day.
#
# TODO: push and open the pull request as a GitHub App (actions/create-github-app-token)
# instead of GITHUB_TOKEN. GitHub starts no workflow for what GITHUB_TOKEN does, so CI
# (continuous_integration.yml, and its required ci_passed) does not run on the pull request
# until someone approves it, with the button GitHub shows on the pull request; on each new
# pull request a run opens.
name: Release PR

on:
  schedule:
    - cron: "0 5 * * 1-6" # 05:00 UTC, Monday to Saturday
  workflow_dispatch:
    inputs:
      version:
        description: "The rc to cut, e.g. 0.19.0-rc.1. Empty: computed from the commits since the last release."
        required: false
        type: string
      branch:
        description: "A new branch to open the pull request from, e.g. release/0.19.0-rc.1. Empty: release/rc, overwritten."
        required: false
        type: string

permissions:
  contents: write # push the release branch
  pull-requests: write # open and close its pull request, and comment on the release PR

concurrency:
  group: release-pr
  cancel-in-progress: false

env:
  # TODO: a GitHub App's token, and its bot (`<app slug>[bot]`) as GIT_BOT; see the header.
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GIT_BOT: github-actions[bot] # the release commit's author

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0 # the commits and tags since the last release

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; the version is package.json's packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile # conventional-changelog and -recommended-bump

      - name: Open, replace or close the rc PR, or comment on the release PR
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BRANCH: ${{ inputs.branch }}
          DAILY: ${{ github.event_name == 'schedule' }}
        run: |
          daily=()
          if [ "$DAILY" = true ]; then daily=(--daily); fi
          scripts/release-pr.sh "${daily[@]}" ${INPUT_VERSION:+--version "$INPUT_VERSION"} ${INPUT_BRANCH:+--branch "$INPUT_BRANCH"}
