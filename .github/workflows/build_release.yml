# Assemble the anfra single binary for every target: collect the pinned sidecar
# binaries (built by their own repos' workflows and attached to Releases), embed
# them, and cross-build the Go host. The anfra host is pure Go so all targets build
# on one runner; both sidecars are prebuilt per target by their own repos'
# workflows — so this job only *collects* and cross-builds.
#
# Runs on a `v*` tag push: normally the one tag_and_release.yml pushes with its
# deploy key, or a tag pushed by hand. The manifest.yml at that commit pins the sidecar
# releases to embed, and the cloud servers login offers. Also runs on
# workflow_dispatch: on a tag it releases that tag, on a branch it's a test build
# (artifacts only, no release).
#
# The version is the tag's. A release candidate (rc), such as v0.23.0-rc.1, is the version its
# commit's manifest.yml names. A release, such as v0.23.0, tags the commit of its rc, whose
# manifest.yml names the rc, so the build takes the release's version from the tag, and merges the
# rc's sections of the changelogs into the release's, as the release PR did on main
# (docs/designs/release.md). After an rc, it opens the release PR, which releases it.
#
# A release also publishes the SDK and the design package to npm, as @holistics/anfra-sdk and
# @holistics/anfra-design at the same version (the sdk job), and the anfra skills to their
# facade, holistics/anfra-skills, when they changed (the skills job).
#
# A prerelease, a version with a `-` such as 0.23.0-rc.1, is published so it can be installed
# by its version, but nothing that finds the latest version picks it: its GitHub release is
# marked as a prerelease, which `anfra update` and install.sh skip (they follow
# /releases/latest), its image takes only its own tag, its npm packages go under `next`, and the
# skills, whose version `anfra update` checks, aren't published.
name: Build anfra release

on:
  push:
    tags:
      - "v*"
  # On a branch: a test build (uploads artifacts, no release). On a tag (`--ref v…`):
  # (re)releases that tag.
  workflow_dispatch:

permissions:
  contents: write # publish the anfra release
  packages: write # push its image to ghcr.io

jobs:
  assemble:
    runs-on: ubuntu-latest
    # Release when the ref is a tag (a tag push, or dispatched on a tag); TAG is that ref.
    # Dispatched on a branch → artifacts only.
    env:
      TAG: ${{ github.ref_name }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
      IS_PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0; on a tag push this is the tag's commit (manifest pinned there)

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: the Go the release builds with (go.mod's toolchain line)
        run: go version

      # Sets ANFRA_CLOUD_URL and ANFRA_CLOUD_SUPPORT_EMAIL, which the build embeds.
      - name: Validate the cloud servers and support email manifest.yml lists
        run: go run ./scripts/cloud-url -manifest manifest.yml >> "$GITHUB_ENV"

      # The Data Apps frontend, which every target embeds (internal/appserve/dist): built once,
      # it is the same files on every platform. A binary without it serves only a page saying
      # it was not built, so a release refuses to go out without it.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; the version is package.json's packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build the Data Apps frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:web
          test -f internal/appserve/dist/index.html

      # The version: the tag's, for a release or an rc; manifest.yml's, for a test build.
      - name: Read manifest
        id: m
        run: |
          version="$(yq '.version' manifest.yml)"
          if [ "$IS_RELEASE" = true ]; then version="${TAG#v}"; fi
          {
            echo "version=$version"
            echo "node_tag=$(yq '.sidecars.anfra_node' manifest.yml)"
            echo "canal_tag=$(yq '.sidecars.anfra_canal' manifest.yml)"
          } >> "$GITHUB_OUTPUT"

      # An rc's tag matches its commit's manifest.yml and SDK. A release's tag is on the commit of
      # an rc of that release, whose changelog sections become the release's. Either way, the
      # changelog has the version's notes.
      - name: Verify the tag, and merge a release's changelog
        if: ${{ env.IS_RELEASE == 'true' }}
        env:
          VERSION: ${{ steps.m.outputs.version }}
        run: |
          manifest="$(yq '.version' manifest.yml)"
          if [ "$IS_PRERELEASE" = true ]; then
            test "$manifest" = "$VERSION" || { echo "tag $TAG != manifest version $manifest"; exit 1; }
            sdk="$(jq -r .version web/sdk/package.json)"
            test "$sdk" = "$VERSION" || { echo "web/sdk/package.json version $sdk != manifest version $VERSION (pnpm bump sets both)"; exit 1; }
          else
            git fetch --quiet --tags origin
            rc="$(node scripts/lib/versions.mjs newest-rc "$VERSION")"
            test -n "$rc" && test "$(git rev-parse "v$rc^{commit}")" = "$(git rev-parse HEAD)" \
              || { echo "$TAG isn't on the commit of its newest rc (${rc:-none}): a release is made from an rc, which tag_and_release.yml tags"; exit 1; }
            node scripts/changelog-merge.mjs "$VERSION" CHANGELOG.md skills/CHANGELOG.md
          fi
          scripts/release-notes.sh "$VERSION" > /dev/null

      - name: Collect sidecar binaries
        env:
          # Cross-repo READ token for `gh release download`. This must be an HTTP
          # token (fine-grained PAT or GitHub App installation token) — NOT an SSH
          # deploy key (gh can't use one) and NOT the per-repo GITHUB_TOKEN (it can't
          # read other repos). Fine-grained PAT settings:
          #   Resource owner:     holistics
          #   Repository access:  holistics/holistics-core, holistics/canal
          #   Permissions:        Contents → Read-only   (Releases live under Contents)
          GH_TOKEN: ${{ secrets.ANFRA_DIST_TOKEN }}
          NODE_TAG: ${{ steps.m.outputs.node_tag }}
          CANAL_TAG: ${{ steps.m.outputs.canal_tag }}
        run: |
          mkdir -p sidecars
          # The minified anfra-node per target, not the -unminified ones beside them,
          # which are for development (scripts/sidecars.sh).
          node_assets=()
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do node_assets+=(-p "anfra-node-$t"); done
          gh release download -R holistics/holistics-core "$NODE_TAG"  -D sidecars "${node_assets[@]}"
          gh release download -R holistics/canal          "$CANAL_TAG" -D sidecars -p 'anfra-canal-*'
          ls -la sidecars

      - name: Cross-build every target
        env:
          VERSION: ${{ steps.m.outputs.version }}
        run: |
          declare -A OS=([linux-x64]=linux [linux-arm64]=linux [darwin-x64]=darwin [darwin-arm64]=darwin)
          declare -A ARCH=([linux-x64]=amd64 [linux-arm64]=arm64 [darwin-x64]=amd64 [darwin-arm64]=arm64)
          mkdir -p release internal/sidecar/anfranode/assets internal/sidecar/anfracanal/assets
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            cp "sidecars/anfra-node-$t"  internal/sidecar/anfranode/assets/anfra-node
            cp "sidecars/anfra-canal-$t" internal/sidecar/anfracanal/assets/anfra-canal
            # -s -w strips the host's symbol table + DWARF (Phase 0).
            GOOS="${OS[$t]}" GOARCH="${ARCH[$t]}" go build -tags embed_sidecar \
              -ldflags "-s -w -X github.com/holistics/anfra/internal/meta.Version=$VERSION -X 'main.defaultCloudURL=$ANFRA_CLOUD_URL' -X 'main.defaultCloudSupportEmail=$ANFRA_CLOUD_SUPPORT_EMAIL'" \
              -o "release/anfra-$t" ./cmd/anfra
            # The image packages the Linux binaries as they are, laid out by platform
            # (<os>/<arch>/anfra) for the Dockerfile.
            if [ "${OS[$t]}" = linux ]; then
              mkdir -p "image/linux/${ARCH[$t]}"
              cp "release/anfra-$t" "image/linux/${ARCH[$t]}/anfra"
            fi
            # Transport compression (Phase 1, see compression.md): publish only the
            # .gz. The embed stays uncompressed so the binary remains delta-friendly.
            gzip -9 "release/anfra-$t"   # replaces anfra-$t with anfra-$t.gz
            file "release/anfra-$t.gz" || true
          done
          ls -la release

      # The image: anfra serve on the release's own Linux binaries, for amd64 and arm64
      # (Dockerfile). A release pushes it as <version>, <major>.<minor> and latest, and a
      # prerelease as <version> only, so the other two stay the latest release's. Any other
      # build only builds it, so a broken Dockerfile shows before a release.
      #
      # Built for both platforms at once, each tag is a multi-platform index: one name for
      # every machine, and Docker pulls the build that matches it. No tag names a platform.
      # `docker buildx imagetools inspect ghcr.io/holistics/anfra:<tag>` lists what a tag holds.
      - name: Image tags
        id: image
        env:
          VERSION: ${{ steps.m.outputs.version }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            echo "$repo:$VERSION"
            if [ "$IS_PRERELEASE" != true ]; then
              echo "$repo:${VERSION%.*}"
              echo "$repo:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: ${{ env.IS_RELEASE == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image, and push it for a release
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: image
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          push: ${{ env.IS_RELEASE == 'true' }}

      # The release's notes are its section of CHANGELOG.md, as `pnpm bump` wrote it in the release
      # commit, then GitHub's: the pull requests, new contributors and compare link
      # (scripts/release-notes.sh). A re-run brings an existing release's notes back in line.
      #
      # CHANGELOG.md is uploaded beside the binaries: `anfra update` prints the notes of the
      # releases it brings from it (internal/update/notes.go).
      - name: Publish release
        if: ${{ env.IS_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # native contents:write on this repo
          VERSION: ${{ steps.m.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body > "$RUNNER_TEMP/generated.md"
          scripts/release-notes.sh "$VERSION" "$RUNNER_TEMP/generated.md" > "$RUNNER_TEMP/notes.md"
          # A prerelease is marked as one, which /releases/latest skips.
          prerelease=()
          if [ "$IS_PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
          fi
          gh release upload "$TAG" release/anfra-* CHANGELOG.md --clobber

      - name: Upload artifacts
        if: ${{ env.IS_RELEASE != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anfra-binaries
          path: release/anfra-*
          if-no-files-found: error

  # The SDK and the design package, published to npm as @holistics/anfra-sdk and
  # @holistics/anfra-design at the release's version, once the release is out. Any other build
  # only packs them, so a broken package shows before a release does.
  #
  # npm takes the publish from this workflow over OIDC, with no token (trusted publishing), and
  # records the package's provenance. npm checks the workflow that started the run, so the
  # package's settings on npmjs.com trust this one, which a tag push starts. A re-run skips a
  # version npm already has: a version is published once.
  sdk:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm's trusted publishing, and the package's provenance
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; the version is package.json's packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node's own may be older.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      # A release's version is its tag's: its commit is its rc's, which names the rc. Set before
      # the dist-tag is chosen below, which goes by this version.
      - name: Set the packages' version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          for pkg in web/sdk web/design; do (cd "$pkg" && npm pkg set version="${GITHUB_REF_NAME#v}"); done
      - run: pnpm build:sdk
      - name: Publish the SDK and the design package, or pack them
        run: |
          for pkg in web/sdk web/design; do
            (
              cd "$pkg"
              if [ "$IS_RELEASE" != true ]; then npm pack --dry-run; exit 0; fi
              name="$(jq -r .name package.json)"
              version="$(jq -r .version package.json)"
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "$name@$version is already on npm"; exit 0
              fi
              # A prerelease (1.2.0-rc.1) must not become what `npm install` picks.
              tag=latest
              case "$version" in *-*) tag=next ;; esac
              npm publish --tag "$tag"
              # A release moves `next` too, if the package has it, so `next` is never older
              # than `latest`.
              if [ "$tag" = latest ] && [ -n "$(npm view "$name" dist-tags.next 2>/dev/null)" ]; then
                npm dist-tag add "$name@$version" next
              fi
            )
          done

  # The anfra skills, published to their facade, holistics/anfra-skills, once the release's
  # binaries are out (docs/designs/agent-setup.md#releasing-the-skills): at the release's version,
  # only when what's published changed. Any other build only reports what a release would do.
  #
  # The push uses a token of a GitHub App with Contents: write on holistics/anfra-skills, allowed
  # past its branch protection (ANFRA_SKILLS_DEPLOYER_APP_ID, ANFRA_SKILLS_DEPLOYER_KEY). A re-run
  # publishes nothing again: the facade then holds this build.
  skills:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
      IS_PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; the version is package.json's packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile # scripts/changelog-merge.mjs reads the changelog's config
      # A release pushes as the App; any other build only reads the public repo.
      - id: deployer
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.ANFRA_SKILLS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.ANFRA_SKILLS_DEPLOYER_KEY }}
          owner: holistics
          repositories: anfra-skills
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: holistics/anfra-skills
          path: facade
          fetch-depth: 1
          token: ${{ steps.deployer.outputs.token || github.token }}
      # A prerelease doesn't publish them: `anfra update` checks the skills' version on the
      # facade, so they would reach everyone before the release does.
      # A release publishes at its tag's version, with its section of skills/CHANGELOG.md merged
      # from its rc's, as the assemble job merges them.
      - name: Publish the skills, or report what a release would publish
        run: |
          version="$(yq '.version' manifest.yml)"
          if [ "$IS_RELEASE" = true ]; then version="${GITHUB_REF_NAME#v}"; fi
          if [ "$IS_RELEASE" = true ] && [ "$IS_PRERELEASE" != true ]; then
            node scripts/changelog-merge.mjs "$version" CHANGELOG.md skills/CHANGELOG.md
          fi
          if [ "$IS_RELEASE" != true ] || [ "$IS_PRERELEASE" = true ]; then
            bash skills/scripts/publish.sh facade "$version" "$GITHUB_SHA"; exit 0
          fi
          git -C facade config user.name "anfra release"
          git -C facade config user.email "anfra-release@users.noreply.github.com"
          bash skills/scripts/publish.sh facade "$version" "$GITHUB_SHA" --commit
          if git -C facade rev-parse -q --verify "refs/tags/anfra-v$version" >/dev/null; then
            git -C facade push origin HEAD:main "refs/tags/anfra-v$version"
          fi

  # After an rc is out, the pull request that releases it (scripts/release-pr.sh --release): on
  # release/next, it sets the version to the release, promoted_from to the rc, and merges the rc's
  # changelog sections. It replaces the release PR of an earlier rc. Merging it, once anfra Cloud
  # runs the rc, is the release.
  release-pr:
    needs: [assemble, sdk]
    if: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push release/next
      pull-requests: write # open its pull request, and close the one it replaces
    env:
      # TODO: a GitHub App's token, and its bot as GIT_BOT, as release_candidate_pr.yml's.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_BOT: github-actions[bot]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0 # the tags, and the commits since the last release
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; the version is package.json's packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Open the release PR
        run: scripts/release-pr.sh --release "${GITHUB_REF_NAME#v}"
