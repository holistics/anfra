# CI, on each pull request and each push to main: conventional-commit lint,
# golangci-lint, build/vet/test, the core API's contract, the SDK and frontend
# (web), the skills, the release manifest, and the dependencies a PR changes.
# Mirrors canal's continuous_integration.yml + test.yml, flattened (anfra is a
# single Go module). `ci_passed` is the one required status check (via
# alls-green). See docs/designs/ci.md.
#
# Each job reads an area of the repo (scripts/ci-areas.sh says which files):
#
# - A job whose result depends on its files alone (lint, go, api, web, skills,
#   manifest) records its pass as an artifact, passed-<area>-<hash>, and skips
#   when its area's hash already passed. So a pull request merged by rebase, the
#   same files as a new commit, passes on main without running again, and a docs
#   change runs none of them.
# - A check that judges the change against its base (commitlint, api-breaking,
#   release, dependency-review) runs on pull requests only, when its area changed
#   from the PR's base.
#
# On main, it checks each commit as merged: two PRs that each passed can still
# break main together, and a release is tagged only on a commit that passed.
#
# It also runs in the merge queue (merge_group), on the queue's commit: the PR
# rebased onto main and any PRs ahead of it. The base checks ran on the PR and
# are skipped there.
name: Continuous Integration

on:
  pull_request: {}
  push:
    branches: [main]
  merge_group: {}
  # A full run: every job, whatever changed. full_ci.yml starts one hourly when main changed,
  # to catch what the areas miss; a Slack channel subscribes to these runs.
  workflow_dispatch: {}

concurrency:
  # One group per PR (refs/pull/<n>/merge): a push cancels the PR's older run.
  # Every other run is its own group, and always finishes: a group holds only one
  # waiting run, so on main a third push would cancel the second's, and a release
  # waits on its commit's.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which jobs run (scripts/ci-areas.sh). A file job runs unless its area's hash
  # already passed, in a run from this repo: a fork's pull request runs its own
  # copy of this workflow, and could record a pass it never checked. A base check
  # runs on a pull request when its area changed from the PR's base.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the artifacts that record the passes
    outputs:
      lint: ${{ steps.files.outputs.lint }}
      lint_hash: ${{ steps.files.outputs.lint_hash }}
      go: ${{ steps.files.outputs.go }}
      go_hash: ${{ steps.files.outputs.go_hash }}
      api: ${{ steps.files.outputs.api }}
      api_hash: ${{ steps.files.outputs.api_hash }}
      web: ${{ steps.files.outputs.web }}
      web_hash: ${{ steps.files.outputs.web_hash }}
      skills: ${{ steps.files.outputs.skills }}
      skills_hash: ${{ steps.files.outputs.skills_hash }}
      manifest: ${{ steps.files.outputs.manifest }}
      manifest_hash: ${{ steps.files.outputs.manifest_hash }}
      api-breaking: ${{ steps.base.outputs.api-breaking }}
      release: ${{ steps.base.outputs.release }}
      dependencies: ${{ steps.base.outputs.dependencies }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A PR's merge commit and its base; a full run, the commits since the previous one.
          fetch-depth: ${{ github.event_name != 'workflow_dispatch' && 2 || 0 }}
          filter: blob:none
      - name: The commits since the previous full run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh run list --workflow continuous_integration.yml --event workflow_dispatch --branch main \
            --json databaseId,headSha --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0].headSha // \"\"")"
          {
            echo "## Full run of $(git log -1 --format='%h %s' HEAD)"
            echo
            if [ -n "$previous" ] && git cat-file -e "$previous" 2>/dev/null; then
              echo "Commits since the previous full run, on $(git log -1 --format=%h "$previous"):"
              echo
              git log --first-parent --format='- %h %s (%an)' "$previous..HEAD"
            else
              echo "No previous full run to compare with."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed() {
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=100" --jq '
              [.artifacts[] | select(.expired | not)
                | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | length > 0'
          }
          scripts/ci-areas.sh hashes HEAD | while IFS='=' read -r key hash; do
            area="${key%_hash}"
            echo "${area}_hash=$hash" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "$area: runs (a full run)"
              echo "$area=true" >> "$GITHUB_OUTPUT"
            elif [ "$(passed "passed-$area-$hash")" = true ]; then
              echo "$area: these files passed before, skipped"
              echo "$area=false" >> "$GITHUB_OUTPUT"
            else
              echo "$area: runs"
              echo "$area=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - id: base
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scripts/ci-areas.sh changed HEAD^1 HEAD | grep -E '^(api-breaking|release|dependencies)=' | tee -a "$GITHUB_OUTPUT"
          fi

  commitlint:
    # PR only: the queue rebases the PR's commits unchanged, so they were linted
    # on the PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # wagoid lists the PR's commits via the API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1; validates PR commits against commitlint.config.mjs

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # annotate the PR with lint findings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # The tool's build is cached with the module's.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # golangci-lint at the version tools/go.mod pins, the one `make ci-lint` runs:
      # one pin, so CI and a local run cannot lint with different versions. The
      # action, not `make ci-lint`, so its findings annotate the PR's lines.
      - name: Build golangci-lint, as tools/go.mod pins it
        run: go build -modfile=tools/go.mod -o "$(go env GOPATH)/bin/golangci-lint" github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          install-mode: none # the binary built above
          args: -v --timeout=10m
      - uses: ./.github/actions/record-pass
        with:
          area: lint
          hash: ${{ needs.changes.outputs.lint_hash }}

  # Tidy, the generated SQL code (sqlc at the version tools/go.mod pins), vet, build, the Go tests.
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: the Go this builds with (go.mod's toolchain line)
        run: go version
      - run: go mod download
      - run: make ci-go
      - uses: ./.github/actions/record-pass
        with:
          area: go
          hash: ${{ needs.changes.outputs.go_hash }}

  # The core API's contract: the committed api/openapi.yaml is what the registry
  # publishes. See scripts/openapi.sh.
  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: make ci-api
      - uses: ./.github/actions/record-pass
        with:
          area: api
          hash: ${{ needs.changes.outputs.api_hash }}

  # A breaking change to the contract, against the PR's base, is declared by a commit
  # (`feat!:`, or a `BREAKING CHANGE:` footer). A base check: PR only.
  api-breaking:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.api-breaking == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the base's spec, and the PR's commits
          filter: blob:none
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: make ci-api-breaking CI_BASE=HEAD^1

  # The Anfra SDK and the appserve frontend (the pnpm workspace): typecheck, tests, the build a
  # release embeds, and the SDK's API types fresh from api/openapi.yaml.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; the version is package.json's packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make ci-web
      - uses: ./.github/actions/record-pass
        with:
          area: web
          hash: ${{ needs.changes.outputs.web_hash }}

  # The release manifest, and what a version bump can break: the versions agree, and the cloud
  # servers a release embeds parse (scripts/cloud-url). An rc or release PR runs this job, and
  # release, alone.
  manifest:
    needs: changes
    if: needs.changes.outputs.manifest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: make ci-manifest
      - uses: ./.github/actions/record-pass
        with:
          area: manifest
          hash: ${{ needs.changes.outputs.manifest_hash }}

  # A PR that changes manifest.yml's version passes scripts/check-release-pr.sh: an rc PR's
  # release isn't out yet, and a release PR is exactly what the bot generates, so main's
  # changelogs say what the release does. A base check: PR only.
  release:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the base, and the tags of the rcs and releases
          fetch-tags: true
      - name: Whether the version changes
        id: version
        run: |
          version() { git show "$1:manifest.yml" | sed -n 's/^version: *//p'; }
          if [ "$(version HEAD^1)" != "$(version HEAD)" ]; then echo "changes=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.changes == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; the version is package.json's packageManager
      - if: steps.version.outputs.changes == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.version.outputs.changes == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.version.outputs.changes == 'true'
        run: scripts/check-release-pr.sh

  # The anfra skills: their front matter and links, the hook's tests, and the facade's build and
  # publish (docs/designs/agent-setup.md#releasing-the-skills).
  skills:
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; the version is package.json's packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make ci-skills
      - uses: ./.github/actions/record-pass
        with:
          area: skills
          hash: ${{ needs.changes.outputs.skills_hash }}

  # Dependencies this PR adds or changes (Go + pnpm), via GitHub's dependency graph;
  # config in .github/dependency-review-config.yml. The action runs twice so the
  # license check can exempt dev tooling under tools/ by manifest path (the action
  # can only exempt a package everywhere) without also swallowing vulnerabilities.
  dependency-review:
    # PR only: it judges the PR's own dependency changes, already reviewed on the
    # PR, and comments on the PR, which a merge group has none of.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment the license failures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0; the config file
      - name: vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          license-check: false
      - name: licenses
        id: licenses
        if: ${{ !cancelled() }}
        continue-on-error: true # judged by the next step, minus tools/
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          vulnerability-check: false
      - name: license verdict
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.licenses.outcome }}
          INVALID: ${{ steps.licenses.outputs.invalid-license-changes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$OUTCOME" = success ]; then exit 0; fi
          if [ -z "$INVALID" ]; then
            echo "the license check failed without a result: see the licenses step" >&2; exit 1
          fi
          entry='"- `\(.manifest)`: \(.name)@\(.version) (\(.license // "unknown license"))"'
          jq -r "[.forbidden[], .unresolved[]] | map(select(.manifest | startswith(\"tools/\"))) | .[] | $entry" <<<"$INVALID" \
            | sed 's/^- /allowed (dev tooling): /'
          FAILURES=$(jq -r "[.forbidden[], .unresolved[]] | map(select(.manifest | startswith(\"tools/\") | not)) | .[] | $entry" <<<"$INVALID")
          if [ -z "$FAILURES" ]; then exit 0; fi
          echo "$FAILURES"
          {
            echo "## ⚠️ License Check Failed"
            echo
            echo "$FAILURES"
            echo
            cat <<'EOF'
          ### How to resolve (edit `.github/dependency-review-config.yml`)

          | Error in the report | What it means | What to do |
          | --- | --- | --- |
          | `GPL-*` / `AGPL-*` / `CC-BY-SA-*` / `SSPL-*` / … | ⛔ Strong copyleft — incompatible with our proprietary SaaS | **Do NOT allowlist.** Migrate to a permissively-licensed alternative and remove the dependency |
          | Another license, or `LicenseRef-clearlydefined-OTHER` | A license not on the `allow-licenses` list, or one GitHub could not classify | Confirm it is permissive, then add the SPDX id to `allow-licenses`, or the package (e.g. `pkg:golang/<module>`, `pkg:npm/<name>`) to `allow-dependencies-licenses` |
          | `unknown license` | GitHub could not resolve the license to a valid SPDX expression | Confirm the license, then add the package to `allow-dependencies-licenses` |

          Dev tooling under `tools/` is exempt. The workflow run's summary has the full report.

          > [!WARNING]
          > Never allowlist strong copyleft (GPL / AGPL / CC-BY-SA / SSPL). Those dependencies must be removed, not added to `allow-licenses`/`allow-dependencies-licenses`.
          EOF
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          exit 1

  # Single required status check: green only when every needed job succeeded.
  # Handles skipped-but-required jobs (re-actors/alls-green).
  ci_passed:
    needs: [changes, commitlint, lint, go, api, api-breaking, web, manifest, release, skills, dependency-review]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      # Every job but changes may skip: a file job when its files passed before, a base check
      # when its area didn't change from the PR's base, or off a PR. changes must pass, so a run
      # that can't tell which jobs to run fails rather than skipping everything.
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: commitlint, lint, go, api, api-breaking, web, manifest, release, skills, dependency-review

  # On a push to main, once every check passed on the pushed commit: tag the rc or release when
  # the push changed manifest.yml's version (tag_and_release.yml). So an rc is tagged only on a
  # commit that passed as merged. `!cancelled()` stops GitHub adding its implicit success(),
  # which checks every upstream job, and those skip on a push, so tag would always skip.
  tag:
    needs: ci_passed
    if: ${{ !cancelled() && github.event_name == 'push' && needs.ci_passed.result == 'success' }}
    uses: ./.github/workflows/tag_and_release.yml
    with:
      before: ${{ github.event.before }}
    secrets:
      ANFRA_DEPLOY_KEY: ${{ secrets.ANFRA_DEPLOY_KEY }} # pushes the tag; the only secret it gets
    permissions:
      contents: read
      actions: read
