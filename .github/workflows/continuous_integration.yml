# PR CI: conventional-commit lint, golangci-lint, build/vet/test, the core API's
# contract, and the SDK and frontend (web). Mirrors canal's
# continuous_integration.yml + test.yml, flattened (anfra is a single Go module). `ci_passed` is the one required status check (via alls-green).
name: Continuous Integration

on:
  pull_request: {}

concurrency:
  group: continuous_integration-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # wagoid lists the PR's commits via the API
    steps:
      - uses: actions/checkout@v4
      - uses: wagoid/commitlint-github-action@v6 # validates PR commits against commitlint.config.mjs

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # annotate the PR with lint findings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: -v --timeout=10m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - name: go.mod is tidy
        run: go mod tidy --diff
      - run: go build -v ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  # The core API's contract: the committed api/openapi.yaml is what the registry
  # publishes, and a breaking change against the base branch is declared by a
  # commit (`feat!:`, or a `BREAKING CHANGE:` footer). See scripts/openapi.sh.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base branch's spec, and the PR's commits
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the contract is fresh
        run: scripts/openapi.sh diff
      - name: no undeclared breaking change
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if ! git cat-file -e "$BASE:api/openapi.yaml" 2>/dev/null; then
            echo "the base branch has no api/openapi.yaml yet: nothing to compare"; exit 0
          fi
          git show "$BASE:api/openapi.yaml" > "$RUNNER_TEMP/base.yaml"
          if scripts/openapi.sh breaking "$RUNNER_TEMP/base.yaml"; then exit 0; fi
          if git log --format=%B "$BASE..HEAD" | grep -Eq '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:'; then
            echo "breaking, and declared by a commit: ok"; exit 0
          fi
          echo "a breaking change to the core API, not declared: mark the commit (feat!: …) or a BREAKING CHANGE: footer" >&2
          exit 1

  # The Anfra SDK and the appserve frontend (the pnpm workspace): typecheck, tests, the build a
  # release embeds, and the SDK's API types fresh from api/openapi.yaml.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # the version is package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: the SDK's version is the release's
        run: |
          sdk="$(jq -r .version web/sdk/package.json)" release="$(yq .version manifest.yml)"
          test "$sdk" = "$release" \
            || { echo "web/sdk/package.json version $sdk != manifest.yml version $release: pnpm bump sets both" >&2; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @holistics/anfra-sdk typecheck
      - name: build, as a release does
        run: pnpm build:web # the SDK, then the frontend, type-checked (vue-tsc)
      - run: pnpm test:web # after the build: the frontend's tests import the built SDK
      - name: the SDK's API types are fresh
        run: |
          pnpm --filter @holistics/anfra-sdk generate
          git diff --exit-code -- web/sdk/src/api/schema.d.ts \
            || { echo "web/sdk/src/api/schema.d.ts is stale: run pnpm --filter @holistics/anfra-sdk generate" >&2; exit 1; }

  # Dependencies this PR adds or changes (Go + pnpm), via GitHub's dependency graph;
  # config in .github/dependency-review-config.yml. The action runs twice so the
  # license check can exempt dev tooling under tools/ by manifest path (the action
  # can only exempt a package everywhere) without also swallowing vulnerabilities.
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment the license failures
    steps:
      - uses: actions/checkout@v4 # the config file
      - name: vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml
          license-check: false
      - name: licenses
        id: licenses
        if: ${{ !cancelled() }}
        continue-on-error: true # judged by the next step, minus tools/
        uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml
          vulnerability-check: false
      - name: license verdict
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.licenses.outcome }}
          INVALID: ${{ steps.licenses.outputs.invalid-license-changes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$OUTCOME" = success ]; then exit 0; fi
          if [ -z "$INVALID" ]; then
            echo "the license check failed without a result: see the licenses step" >&2; exit 1
          fi
          entry='"- `\(.manifest)`: \(.name)@\(.version) (\(.license // "unknown license"))"'
          jq -r "[.forbidden[], .unresolved[]] | map(select(.manifest | startswith(\"tools/\"))) | .[] | $entry" <<<"$INVALID" \
            | sed 's/^- /allowed (dev tooling): /'
          FAILURES=$(jq -r "[.forbidden[], .unresolved[]] | map(select(.manifest | startswith(\"tools/\") | not)) | .[] | $entry" <<<"$INVALID")
          if [ -z "$FAILURES" ]; then exit 0; fi
          echo "$FAILURES"
          {
            echo "## ⚠️ License Check Failed"
            echo
            echo "$FAILURES"
            echo
            cat <<'EOF'
          ### How to resolve (edit `.github/dependency-review-config.yml`)

          | Error in the report | What it means | What to do |
          | --- | --- | --- |
          | `GPL-*` / `AGPL-*` / `CC-BY-SA-*` / `SSPL-*` / … | ⛔ Strong copyleft — incompatible with our proprietary SaaS | **Do NOT allowlist.** Migrate to a permissively-licensed alternative and remove the dependency |
          | Another license, or `LicenseRef-clearlydefined-OTHER` | A license not on the `allow-licenses` list, or one GitHub could not classify | Confirm it is permissive, then add the SPDX id to `allow-licenses`, or the package (e.g. `pkg:golang/<module>`, `pkg:npm/<name>`) to `allow-dependencies-licenses` |
          | `unknown license` | GitHub could not resolve the license to a valid SPDX expression | Confirm the license, then add the package to `allow-dependencies-licenses` |

          Dev tooling under `tools/` is exempt. The workflow run's summary has the full report.

          > [!WARNING]
          > Never allowlist strong copyleft (GPL / AGPL / CC-BY-SA / SSPL). Those dependencies must be removed, not added to `allow-licenses`/`allow-dependencies-licenses`.
          EOF
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          exit 1

  # Single required status check: green only when every needed job succeeded.
  # Handles skipped-but-required jobs (re-actors/alls-green).
  ci_passed:
    needs: [commitlint, lint, test, api, web, dependency-review]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
