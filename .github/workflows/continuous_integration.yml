# PR CI: conventional-commit lint, golangci-lint, build/vet/test, the core API's
# contract, and the SDK and frontend (web). Mirrors canal's
# continuous_integration.yml + test.yml, flattened (anfra is a single Go module). `ci_passed` is the one required status check (via alls-green).
#
# It also runs in the merge queue (merge_group), on the queue's commit: the PR
# rebased onto main and any PRs ahead of it. The repo merges by rebase, so the
# queue replays the PR's commits unchanged; the jobs that judge only the PR's own
# commits and diff (commitlint, dependency-review) ran on the PR and are skipped
# there.
#
# A change only to skills/ runs only the skills' checks (the skills job): the
# Go, API and web jobs are skipped, since nothing they check changed.
name: Continuous Integration

on:
  pull_request: {}
  merge_group: {}

concurrency:
  # One group per PR (refs/pull/<n>/merge): a push cancels the PR's older run.
  # A merge group's ref (gh-readonly-queue/main/pr-<n>-<sha>) is its own, so
  # queued runs never cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether the change touches anything outside skills/: the code the lint,
  # test, api and web jobs check. On a PR, against its base branch; in the merge
  # queue, against the queue's base commit.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code_any_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the base commit, for the diff
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: filter
        with:
          files_yaml: |
            code:
              - '**'
              - '!skills/**'
      - name: Show changes
        run: echo "$OUTPUTS"
        env:
          OUTPUTS: ${{ toJSON(steps.filter.outputs) }}

  commitlint:
    # PR only: the queue rebases the PR's commits unchanged, so they were linted
    # on the PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # wagoid lists the PR's commits via the API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1; validates PR commits against commitlint.config.mjs

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # annotate the PR with lint findings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # The tool's build is cached with the module's.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # golangci-lint at the version tools/go.mod pins, the one `make check` runs:
      # one pin, so CI and a local run cannot lint with different versions.
      - name: Build golangci-lint, as tools/go.mod pins it
        run: go build -modfile=tools/go.mod -o "$(go env GOPATH)/bin/golangci-lint" github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          install-mode: none # the binary built above
          args: -v --timeout=10m

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: the Go this builds with (go.mod's toolchain line)
        run: go version
      - run: go mod download
      - name: go.mod is tidy
        run: go mod tidy --diff
      - run: go build -v ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  # The core API's contract: the committed api/openapi.yaml is what the registry
  # publishes, and a breaking change against the base branch is declared by a
  # commit (`feat!:`, or a `BREAKING CHANGE:` footer). See scripts/openapi.sh.
  api:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the base branch's spec, and the PR's commits
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: the contract is fresh
        run: scripts/openapi.sh diff
      - name: no undeclared breaking change
        env:
          # The branch the change lands on: a PR's base, or the merge group's base commit.
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: |
          if ! git cat-file -e "$BASE:api/openapi.yaml" 2>/dev/null; then
            echo "the base branch has no api/openapi.yaml yet: nothing to compare"; exit 0
          fi
          git show "$BASE:api/openapi.yaml" > "$RUNNER_TEMP/base.yaml"
          if scripts/openapi.sh breaking "$RUNNER_TEMP/base.yaml"; then exit 0; fi
          if git log --format=%B "$BASE..HEAD" | grep -Eq '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:'; then
            echo "breaking, and declared by a commit: ok"; exit 0
          fi
          echo "a breaking change to the core API, not declared: mark the commit (feat!: …) or a BREAKING CHANGE: footer" >&2
          exit 1

  # The Anfra SDK and the appserve frontend (the pnpm workspace): typecheck, tests, the build a
  # release embeds, and the SDK's API types fresh from api/openapi.yaml.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; the version is package.json's packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: the SDK's and the design package's versions are the release's
        run: |
          release="$(yq .version manifest.yml)"
          for pkg in web/sdk web/design; do
            version="$(jq -r .version "$pkg/package.json")"
            test "$version" = "$release" \
              || { echo "$pkg/package.json version $version != manifest.yml version $release: pnpm bump sets them all" >&2; exit 1; }
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @holistics/anfra-sdk typecheck
      - name: build, as a release does
        run: pnpm build:web # the SDK, then the frontend, type-checked (vue-tsc)
      - run: pnpm test:web # after the build: the frontend's tests import the built SDK
      - name: the SDK's API types are fresh
        run: |
          pnpm --filter @holistics/anfra-sdk generate
          git diff --exit-code -- web/sdk/src/api/schema.d.ts \
            || { echo "web/sdk/src/api/schema.d.ts is stale: run pnpm --filter @holistics/anfra-sdk generate" >&2; exit 1; }

  # The anfra skills: their front matter and links, the hook's tests, and the facade's build and
  # publish (docs/designs/agent-setup.md#releasing-the-skills). Runs on every change.
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; the version is package.json's packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm skills:check

  # Dependencies this PR adds or changes (Go + pnpm), via GitHub's dependency graph;
  # config in .github/dependency-review-config.yml. The action runs twice so the
  # license check can exempt dev tooling under tools/ by manifest path (the action
  # can only exempt a package everywhere) without also swallowing vulnerabilities.
  dependency-review:
    # PR only: it judges the PR's own dependency changes, already reviewed on the
    # PR, and comments on the PR, which a merge group has none of.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment the license failures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0; the config file
      - name: vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          license-check: false
      - name: licenses
        id: licenses
        if: ${{ !cancelled() }}
        continue-on-error: true # judged by the next step, minus tools/
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          vulnerability-check: false
      - name: license verdict
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.licenses.outcome }}
          INVALID: ${{ steps.licenses.outputs.invalid-license-changes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$OUTCOME" = success ]; then exit 0; fi
          if [ -z "$INVALID" ]; then
            echo "the license check failed without a result: see the licenses step" >&2; exit 1
          fi
          entry='"- `\(.manifest)`: \(.name)@\(.version) (\(.license // "unknown license"))"'
          jq -r "[.forbidden[], .unresolved[]] | map(select(.manifest | startswith(\"tools/\"))) | .[] | $entry" <<<"$INVALID" \
            | sed 's/^- /allowed (dev tooling): /'
          FAILURES=$(jq -r "[.forbidden[], .unresolved[]] | map(select(.manifest | startswith(\"tools/\") | not)) | .[] | $entry" <<<"$INVALID")
          if [ -z "$FAILURES" ]; then exit 0; fi
          echo "$FAILURES"
          {
            echo "## ⚠️ License Check Failed"
            echo
            echo "$FAILURES"
            echo
            cat <<'EOF'
          ### How to resolve (edit `.github/dependency-review-config.yml`)

          | Error in the report | What it means | What to do |
          | --- | --- | --- |
          | `GPL-*` / `AGPL-*` / `CC-BY-SA-*` / `SSPL-*` / … | ⛔ Strong copyleft — incompatible with our proprietary SaaS | **Do NOT allowlist.** Migrate to a permissively-licensed alternative and remove the dependency |
          | Another license, or `LicenseRef-clearlydefined-OTHER` | A license not on the `allow-licenses` list, or one GitHub could not classify | Confirm it is permissive, then add the SPDX id to `allow-licenses`, or the package (e.g. `pkg:golang/<module>`, `pkg:npm/<name>`) to `allow-dependencies-licenses` |
          | `unknown license` | GitHub could not resolve the license to a valid SPDX expression | Confirm the license, then add the package to `allow-dependencies-licenses` |

          Dev tooling under `tools/` is exempt. The workflow run's summary has the full report.

          > [!WARNING]
          > Never allowlist strong copyleft (GPL / AGPL / CC-BY-SA / SSPL). Those dependencies must be removed, not added to `allow-licenses`/`allow-dependencies-licenses`.
          EOF
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          exit 1

  # Single required status check: green only when every needed job succeeded.
  # Handles skipped-but-required jobs (re-actors/alls-green).
  ci_passed:
    needs: [changes, commitlint, lint, test, api, web, skills, dependency-review]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - id: skips
        env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          skips=()
          # Skipped in the merge queue: they judged the PR already.
          if [ "$EVENT" = merge_group ]; then skips+=(commitlint dependency-review); fi
          # Skipped when only skills/ changed.
          if [ "$CODE" = false ]; then skips+=(lint test api web); fi
          echo "list=$(IFS=,; echo "${skips[*]}")" >> "$GITHUB_OUTPUT"
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ steps.skips.outputs.list }}
