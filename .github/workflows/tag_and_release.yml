# Cut an anfra release. When manifest.yml lands on main with a `version` that has
# no matching tag yet, create `anfra-v<version>`; the tag push then triggers
# build_release.yml, which assembles + publishes.
#
# The tag is pushed with a deploy key (ANFRA_DEPLOY_KEY), not GITHUB_TOKEN:
# - the "release tags" ruleset blocks creating tags, and GITHUB_TOKEN can't be a
#   bypass actor; deploy keys are;
# - a GITHUB_TOKEN-pushed tag wouldn't trigger build_release.yml's `on: push: tags`
#   (GitHub blocks recursive runs); a deploy-key push does.
#
# Flow to cut a release: bump `version` (and sidecar pins) in manifest.yml in a PR
# -> merge to main -> this tags -> build_release.yml publishes.
name: Tag & release anfra

on:
  push:
    branches:
      - main
    paths:
      - manifest.yml
  workflow_dispatch: # manual re-run

permissions:
  contents: read # the tag is pushed with the deploy key, not GITHUB_TOKEN

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.ANFRA_DEPLOY_KEY }} # git pushes over SSH as the deploy key

      - name: Create tag if new
        run: |
          version="$(yq '.version' manifest.yml)"
          test -n "$version" && test "$version" != null || { echo "no version in manifest.yml"; exit 1; }
          tag="anfra-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists — bump manifest.yml version to cut a release"
          else
            git tag "$tag" HEAD
            git push origin "$tag"
            echo "pushed $tag"
          fi
